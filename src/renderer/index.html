<!DOCTYPE html>
<html>
    <head>
        <title>Flipper Desk | 一站式办公生活空间 </title>
        <meta charset="utf-8">

        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- highlight.js核心样式 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs.min.css">

        <script src="../renderer/components/agentinput.js"></script>
        <script src="../renderer/components/taskview.js"></script>
        <script src="../renderer/components/sidebar.js"></script>
        <script src="../renderer/components/setting.js"></script>
        <script src="../renderer/components/logview.js"></script>
        <script src="../renderer/components/fileview.js"></script>
        <script src="../renderer/components/homepage.js"></script>
    </head>
    <body>
        <div class="h-screen flex">
            <!-- 左侧面板 -->
            <div id="leftPanel" class="bg-gray-100 p-4 overflow-auto" style="width: 30%;">
                <main-sidebar id="main-sidebar" style="width: 100%; height: 100%;"/>
            </div>

            <!-- 分界线 -->
            <div id="resizer" class="w-1 bg-gray-300 cursor-col-resize hover:bg-blue-500 transition-colors relative group">
                <div class="absolute inset-y-0 -left-1 -right-1"></div>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1 h-8 bg-gray-500 rounded group-hover:bg-blue-600"></div>
            </div>

            <!-- 右侧面板 -->
            <div id="rightPanel" class="bg-white p-0 overflow-auto flex-1 flex flex-col">
                <home-page id="home-page" class="h-full w-full" />
            </div>
        </div>
    </body>

    <script>
    /**
     * Open a task by its id
     * @param {string | null} taskId
     */
    function openTask(taskId) {
        if (taskId === null) {
            document.querySelector('#rightPanel').innerHTML = "";
            return;
        } else {
            document.querySelector('#rightPanel').innerHTML = `
            <task-view task_id="${taskId}" style="width: 100%; height: 100%;"/>
            `
        }
    }

    window.globalControlAPI = {
        openSettingEditor: () => {
            document.querySelector('#rightPanel').innerHTML = `
            <setting-editor style="width: 100%; height: 100%;"/>
            `
        },
        openLogView: () => {
            document.querySelector('#rightPanel').innerHTML = `
            <log-view style="width: 100%; height: 100%;"/>
            `
        },
        openTask: (taskId) => {
            openTask(taskId)
        },
        openHomePage: () => {
            document.querySelector('#rightPanel').innerHTML = `
            <home-page style="width: 100%; height: 100%;"/>
            `
        }
    }

    const resizer = document.getElementById('resizer');
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');

    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        const containerWidth = resizer.parentElement.offsetWidth;
        const leftWidth = (e.clientX / containerWidth) * 100;

        // 限制最小和最大宽度
        if (leftWidth < 15) return;
        if (leftWidth > 85) return;

        leftPanel.style.width = leftWidth + '%';
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
    </script>
</html>
