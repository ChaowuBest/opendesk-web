<!doctype html>
<html>
    <head>
        <title>OpenDesk | 一站式办公生活空间</title>
        <meta charset="utf-8" />

        <!-- 与MarkDown渲染有关的样式表 -->
        <link rel="stylesheet" href="./styles/common.css" />
        <link rel="stylesheet" href="./styles/highlight-vs.min.css" />
        <link rel="stylesheet" href="./styles/github-markdown-light.min.css" />

        <script type="module" src="./scripts/index.js"></script>

        <link rel="stylesheet" href="./styles/titlebar.css" />
        <link rel="stylesheet" href="./styles/custom.css" />
    </head>
    <body>
        <div class="drag-overlay">
            <div class="absolute top-0 right-0 z-10 flex">
                <button
                    id="shortcut-help-btn"
                    title="快捷键帮助"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
                >
                    <i class="fa-solid fa-keyboard"></i>
                </button>
                <button
                    id="minimize-btn"
                    title="最小化"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
                    onclick="window.settingAPI.minimizeMainWindow()"
                >
                    <i class="fas fa-minus"></i>
                </button>
                <button
                    id="maximize-btn"
                    title="最大化"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
                    onclick="window.settingAPI.maximizeMainWindow().then(() => window.updateMaximizeIcon())"
                >
                    <i class="far fa-square" id="maximize-icon"></i>
                </button>
                <button
                    id="close-drag-overlay-btn"
                    title="关闭"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-red-500 hover:text-white transition"
                    onclick="window.settingAPI.closeMainWindow()"
                >
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="w-full h-screen">
            <splitter-widget class="w-full h-full flex">
                <!-- 左侧面板 -->
                <div id="leftPanel" slot="left" class="bg-[#f5f5f5] p-4 overflow-auto w-full h-full">
                    <main-sidebar id="main-sidebar" class="w-full h-full" />
                </div>

                <!-- 右侧面板 -->
                <div id="rightPanel" slot="right" class="bg-white p-0 overflow-auto w-full h-full">
                    <div id="rightPanelInner" style="position: relative; width: 100%; height: 100%">
                        <div id="nonAppSlot" class="w-full h-full">
                            <home-page id="home-page" class="h-full w-full" />
                        </div>
                        <div
                            id="app-frames-container"
                            style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%"
                        ></div>
                    </div>
                </div>
            </splitter-widget>

            <!-- 通知面板 -->
            <notification-panel
                id="notification-panel"
                class="fixed top-16 right-5 z-50 flex flex-col gap-3 w-[360px] font-sans"
            ></notification-panel>
        </div>

        <!-- 快捷键帮助面板（置于 body 顶层以避免被 overflow 裁切） -->
        <shortcut-help-panel id="shortcut-help-panel"></shortcut-help-panel>
    </body>

    <script type="module">
        import { guiShortcutManager } from './components/shortcutManager.ts';

        // Initialize shortcut manager and register built-in shortcuts
        guiShortcutManager.register({
            id: 'help:toggle-shortcut-panel',
            label: '快捷键帮助',
            category: '通用',
            keys: ['Ctrl+/'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === '/',
            handler: () => document.getElementById('shortcut-help-panel')?.toggle()
        });

        guiShortcutManager.register({
            id: 'help:close-shortcut-panel',
            label: '关闭帮助面板',
            category: '通用',
            keys: ['Esc'],
            match: (e) => e.key === 'Escape',
            handler: () => document.getElementById('shortcut-help-panel')?.hide()
        });

        guiShortcutManager.register({
            id: 'display:zoom-in',
            label: '放大界面',
            category: '显示',
            keys: ['Ctrl++ / ='],
            match: (e) => (e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+'),
            handler: () => window.displayAPI?.adjustScaleFactor(0.1)
        });

        guiShortcutManager.register({
            id: 'display:zoom-out',
            label: '缩小界面',
            category: '显示',
            keys: ['Ctrl+-'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === '-',
            handler: () => window.displayAPI?.adjustScaleFactor(-0.1)
        });

        guiShortcutManager.register({
            id: 'display:zoom-reset',
            label: '重置缩放',
            category: '显示',
            keys: ['Ctrl+0'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === '0',
            handler: () => window.displayAPI?.setScaleFactor(1)
        });

        guiShortcutManager.attach();
        window.__guiShortcutManager = guiShortcutManager;

        document.getElementById('shortcut-help-btn')?.addEventListener('click', () => {
            const panel = document.getElementById('shortcut-help-panel');
            if (panel && typeof panel.toggle === 'function') {
                panel.toggle();
            }
        });

        (function () {
            var nonAppSlot = null;
            var appFramesContainer = null;
            var appFrameCache = {};
            var taskViewCache = {};
            var currentNonAppContent = null; // 'home' | 'task:xxx' | 'setting' | 'logview'

            function ensureSlots() {
                if (nonAppSlot && appFramesContainer) return;
                nonAppSlot = document.getElementById('nonAppSlot');
                appFramesContainer = document.getElementById('app-frames-container');
                if (!nonAppSlot || !appFramesContainer) return;
                if (!window.__appFrameCache) window.__appFrameCache = {};
                appFrameCache = window.__appFrameCache;
            }

            function showNonApp() {
                ensureSlots();
                if (nonAppSlot) nonAppSlot.style.display = '';
                if (appFramesContainer) appFramesContainer.style.display = 'none';
            }

            function showAppFrames() {
                ensureSlots();
                if (nonAppSlot) nonAppSlot.style.display = 'none';
                if (appFramesContainer) appFramesContainer.style.display = 'block';
            }

            /**
             * 隐藏 nonAppSlot 中所有直接子元素
             */
            function hideAllNonAppChildren() {
                if (!nonAppSlot) return;
                for (var i = 0; i < nonAppSlot.children.length; i++) {
                    nonAppSlot.children[i].style.display = 'none';
                }
            }

            /**
             * 清除非 task-view 的临时内容（如 home-page、setting-editor、log-view）
             */
            function clearNonTaskContent() {
                if (!nonAppSlot) return;
                var toRemove = [];
                for (var i = 0; i < nonAppSlot.children.length; i++) {
                    var child = nonAppSlot.children[i];
                    if (!child.hasAttribute('data-task-view-cached')) {
                        toRemove.push(child);
                    }
                }
                for (var j = 0; j < toRemove.length; j++) {
                    nonAppSlot.removeChild(toRemove[j]);
                }
            }

            function openTask(taskId) {
                ensureSlots();
                window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed');
                hideAllNonAppChildren();

                if (taskId === null) {
                    clearNonTaskContent();
                    var homePage = document.createElement('home-page');
                    homePage.id = 'home-page';
                    homePage.className = 'h-full w-full';
                    homePage.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(homePage);
                    currentNonAppContent = 'home';
                } else {
                    clearNonTaskContent();
                    if (!taskViewCache[taskId]) {
                        var el = document.createElement('task-view');
                        el.setAttribute('task_id', taskId);
                        el.setAttribute('data-task-view-cached', '1');
                        el.style.cssText = 'width:100%;height:100%;';
                        nonAppSlot.appendChild(el);
                        taskViewCache[taskId] = el;
                    }
                    taskViewCache[taskId].style.display = '';
                    if (taskViewCache[taskId].syncRightSidebarState) {
                        taskViewCache[taskId].syncRightSidebarState();
                    }
                    currentNonAppContent = 'task:' + taskId;
                }
                showNonApp();
            }

            async function needsWizard() {
                try {
                    var data = await window.settingAPI.loadSettingObject();
                    return !data.providers || data.providers.length === 0;
                } catch (e) {
                    return false;
                }
            }

            function openHomePage() {
                ensureSlots();
                window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed');
                hideAllNonAppChildren();
                clearNonTaskContent();
                var homePage = document.createElement('home-page');
                homePage.id = 'home-page';
                homePage.className = 'h-full w-full';
                homePage.style.cssText = 'width:100%;height:100%;';
                nonAppSlot.appendChild(homePage);
                currentNonAppContent = 'home';
                showNonApp();
                needsWizard().then(function (needs) {
                    if (needs) {
                        window.globalControlAPI.openWizard();
                    }
                });
            }

            /**
             * 当任务被删除时，从缓存中清除对应的 task-view
             */
            function removeTaskViewCache(taskId) {
                if (taskViewCache[taskId]) {
                    if (taskViewCache[taskId].parentNode) {
                        taskViewCache[taskId].parentNode.removeChild(taskViewCache[taskId]);
                    }
                    delete taskViewCache[taskId];
                }
            }

            /**
             * 清除所有 task-view 缓存
             */
            function clearAllTaskViewCache() {
                Object.keys(taskViewCache).forEach(function (tid) {
                    removeTaskViewCache(tid);
                });
            }

            window.settingAPI.registerCommandCallback('openHomePage', openHomePage);

            async function updateMaximizeIcon() {
                const isMaximized = await window.settingAPI.isMaximized();
                const maximizeIcon = document.getElementById('maximize-icon');
                if (maximizeIcon) {
                    maximizeIcon.className = isMaximized ? 'fas fa-window-restore' : 'far fa-square';
                }
            }
            window.updateMaximizeIcon = updateMaximizeIcon;
            window.addEventListener('resize', updateMaximizeIcon);
            updateMaximizeIcon();

            window.globalControlAPI = {
                openWizard: function () {
                    ensureSlots();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setup-wizard');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'wizard';
                    showNonApp();
                },
                openSettingEditor: function () {
                    ensureSlots();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setting-panel');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'setting';
                    showNonApp();
                },
                openAdvancedSettingEditor: function () {
                    ensureSlots();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setting-editor');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'setting';
                    showNonApp();
                },
                openLogView: function () {
                    ensureSlots();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('log-view');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'logview';
                    showNonApp();
                },
                openTask: openTask,
                openHomePage: openHomePage,
                removeTaskViewCache: removeTaskViewCache,
                clearAllTaskViewCache: clearAllTaskViewCache,
                openApplication: function (bundleName) {
                    ensureSlots();
                    // 如果切换到其他应用，通知邮箱应用用户已离开
                    if (bundleName !== 'mailbox') {
                        window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed');
                    } else {
                        window.applicationRegistryAPI.call('mailbox', 'notifyMailboxOpened');
                    }
                    if (!appFrameCache[bundleName]) {
                        var iframe = document.createElement('iframe');
                        iframe.className = 'w-full h-full';
                        iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:0;';
                        iframe.src = './application.html?applicationBundleName=' + encodeURIComponent(bundleName);
                        appFramesContainer.appendChild(iframe);
                        appFrameCache[bundleName] = iframe;
                    }
                    Object.keys(appFrameCache).forEach(function (name) {
                        appFrameCache[name].style.display = name === bundleName ? 'block' : 'none';
                    });
                    showAppFrames();
                }
            };

            // 初始化时检查是否需要引导
            needsWizard().then(function (needs) {
                if (needs) {
                    window.globalControlAPI.openWizard();
                }
            });
        })();
    </script>
</html>
