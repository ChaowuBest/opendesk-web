<!doctype html>
<html>
    <head>
        <script>
            // 防止深色模式 FOUC：在首帧渲染前同步设置 data-theme
            (function () {
                var stored = localStorage.getItem('opendesk-theme-effective');
                if (stored === 'dark' || stored === 'light') {
                    document.documentElement.dataset.theme = stored;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.dataset.theme = 'dark';
                }
                if (localStorage.getItem('opendesk-sidebar-collapsed') === 'true') {
                    document.documentElement.classList.add('startup-sidebar-collapsed');
                }
                // Linux 无边框窗口由页面自绘圆角，需在首帧前挂类避免闪现方形窗口
                if (window.systemInfo && window.systemInfo.isLinux) {
                    document.documentElement.classList.add('window-rounded');
                    // 阴影边距（CSS 像素）要按 zoom factor 反算才能对齐 main 侧的
                    // DIP 边距，首帧前同步写入，避免边距先按未缩放值渲染再跳一下
                    var windowZoom = window.systemInfo.initialZoomFactor;
                    if (windowZoom && windowZoom !== 1) {
                        document.documentElement.style.setProperty('--od-window-zoom', String(windowZoom));
                    }
                }
            })();
        </script>
        <title>OpenDesk | 一站式办公生活空间</title>
        <meta charset="utf-8" />
        <style id="startup-shell-styles">
            #startup-shell {
                --startup-shell-bg: #f5f5f5;
                --startup-shell-panel: #ffffff;
                --startup-shell-muted: #e9e9e9;
                --startup-shell-muted-strong: #dcdcdc;
                position: fixed;
                inset: 0;
                z-index: 1;
                display: grid;
                grid-template-columns: 316px minmax(0, 1fr);
                overflow: hidden;
                background: var(--startup-shell-panel);
                opacity: 1;
                pointer-events: none;
                transition: opacity 0.15s ease-out;
            }

            html[data-theme='dark'] #startup-shell {
                --startup-shell-bg: #1e1e1e;
                --startup-shell-panel: #252526;
                --startup-shell-muted: #333333;
                --startup-shell-muted-strong: #444444;
            }

            #startup-shell.startup-shell-hidden {
                opacity: 0;
            }

            .startup-shell-sidebar {
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 26px;
                padding: 48px 24px 24px;
                background: var(--startup-shell-bg);
            }

            .startup-shell-brand,
            .startup-shell-row {
                display: flex;
                align-items: center;
            }

            .startup-shell-brand {
                gap: 12px;
            }

            .startup-shell-mark {
                position: relative;
                width: 28px;
                height: 28px;
                border-radius: 9px;
                background: #df4436;
            }

            .startup-shell-mark::before,
            .startup-shell-mark::after {
                position: absolute;
                top: 8px;
                width: 5px;
                height: 12px;
                border-radius: 3px;
                background: rgba(255, 255, 255, 0.9);
                content: '';
            }

            .startup-shell-mark::before {
                left: 7px;
            }

            .startup-shell-mark::after {
                right: 7px;
            }

            .startup-shell-brand-line {
                width: 104px;
                height: 13px;
                border-radius: 7px;
                background: var(--startup-shell-muted-strong);
            }

            .startup-shell-nav {
                display: grid;
                gap: 14px;
            }

            .startup-shell-row {
                gap: 12px;
                height: 28px;
            }

            .startup-shell-row::before {
                width: 18px;
                height: 18px;
                flex: none;
                border-radius: 6px;
                background: var(--startup-shell-muted-strong);
                content: '';
            }

            .startup-shell-row::after {
                width: var(--startup-row-width, 118px);
                height: 10px;
                border-radius: 5px;
                background: var(--startup-shell-muted);
                content: '';
            }

            .startup-shell-sidebar-footer {
                width: 72%;
                height: 10px;
                margin-top: auto;
                border-radius: 5px;
                background: var(--startup-shell-muted);
            }

            .startup-shell-content {
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                padding: 64px 8vw 48px;
                background: var(--startup-shell-panel);
            }

            .startup-shell-card {
                display: grid;
                width: min(680px, 82%);
                gap: 18px;
            }

            .startup-shell-heading {
                width: 46%;
                height: 20px;
                border-radius: 10px;
                background: var(--startup-shell-muted-strong);
            }

            .startup-shell-subheading {
                width: 68%;
                height: 11px;
                border-radius: 6px;
                background: var(--startup-shell-muted);
            }

            .startup-shell-input {
                box-sizing: border-box;
                height: 118px;
                margin-top: 18px;
                border: 1px solid var(--startup-shell-muted);
                border-radius: 18px;
                background: var(--startup-shell-panel);
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
            }

            .startup-shell-actions {
                display: flex;
                gap: 12px;
            }

            .startup-shell-action {
                width: 92px;
                height: 30px;
                border-radius: 15px;
                background: var(--startup-shell-muted);
            }

            html.startup-sidebar-collapsed #startup-shell {
                grid-template-columns: 50px minmax(0, 1fr);
            }

            html.startup-sidebar-collapsed .startup-shell-sidebar {
                padding: 0;
            }

            html.startup-sidebar-collapsed .startup-shell-sidebar > * {
                display: none;
            }

            @media (prefers-reduced-motion: reduce) {
                #startup-shell {
                    transition: none;
                }
            }
        </style>

    <script type="module">
        import { guiShortcutManager } from './components/shortcutManager.ts';
        import { registerChatFindShortcut } from './components/chatFind.js';
        import { createRendererTranslator } from './locale.js';
        import { registerDisplayZoomShortcuts } from './scripts/display-zoom-shortcuts.ts';
        import { initRendererTheme } from './theme/theme-renderer.ts';
        import {
            broadcastThemeToAppFrames,
            getAppSubFrameWindow,
            postThemeToWindow,
            syncThemeToAppFrame
        } from './theme/theme-iframe-bridge.ts';
        import { registerApplicationFrameProxyHost } from './scripts/application-frame-proxy.ts';
        import { isExperimentalApplicationEnabled } from './utils/application-visibility.ts';
        import { selectTaskViewsToEvict, MAX_RESIDENT_TASK_VIEWS } from './utils/task-view-release.ts';

        registerApplicationFrameProxyHost();
        initRendererTheme().catch((err) => console.warn('[theme] init failed', err));
        window.broadcastThemeSettings = broadcastThemeToAppFrames;

        // Initialize shortcut manager and register built-in shortcuts
        guiShortcutManager.register({
            id: 'help:toggle-shortcut-panel',
            label: '快捷键帮助',
            category: '通用',
            keys: ['Ctrl+/'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === '/',
            handler: () => document.getElementById('shortcut-help-panel')?.toggle()
        });

        guiShortcutManager.register({
            id: 'help:close-shortcut-panel',
            label: '关闭帮助面板',
            category: '通用',
            keys: ['Esc'],
            match: (e) => {
                if (e.key !== 'Escape') return false;
                const panel = document.getElementById('shortcut-help-panel');
                return panel && panel._visible === true;
            },
            handler: () => document.getElementById('shortcut-help-panel')?.hide()
        });

        // 界面缩放快捷键与独立应用窗口共用同一份定义
        registerDisplayZoomShortcuts();

        guiShortcutManager.attach();
        window.__guiShortcutManager = guiShortcutManager;
        // 注册聊天范围的 Ctrl/⌘+F；设置更新时同步刷新快捷键的本地化名称。
        function registerConversationFind(setting) {
            registerChatFindShortcut(guiShortcutManager, {
                document,
                isMac: /Mac|iPhone|iPad/.test(navigator.platform),
                translate: createRendererTranslator(setting)
            });
        }
        registerConversationFind();
        window.settingAPI?.onSettingChanged?.(registerConversationFind);

        // ---- 浏览器应用快捷键 ----
        function isBrowserActive() {
            var el = document.querySelector('#nonAppSlot > browser-entry-widget');
            return el && el.style.display !== 'none' && el.offsetParent !== null;
        }
        function getBrowserWidget() {
            return document.querySelector('#nonAppSlot > browser-entry-widget');
        }

        guiShortcutManager.register({
            id: 'browser:new-tab',
            label: '新建标签页',
            category: '浏览器',
            keys: ['Ctrl+N'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === 'n' && isBrowserActive(),
            handler: () => {
                var w = getBrowserWidget();
                if (w && w.addTab) w.addTab('opendesk://homepage/');
            }
        });

        guiShortcutManager.register({
            id: 'browser:focus-address-bar',
            label: '聚焦地址栏',
            category: '浏览器',
            keys: ['Ctrl+L'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === 'l' && isBrowserActive(),
            handler: () => {
                var w = getBrowserWidget();
                if (w && w.focusUrlBar) w.focusUrlBar();
            }
        });

        guiShortcutManager.register({
            id: 'browser:close-tab',
            label: '关闭当前标签页',
            category: '浏览器',
            keys: ['Ctrl+W'],
            match: (e) => (e.ctrlKey || e.metaKey) && e.key === 'w' && isBrowserActive(),
            handler: () => {
                var w = getBrowserWidget();
                if (w && w.closeActiveTab) w.closeActiveTab();
            }
        });

        // 初始化字体预设 & 侧边栏宽度
        (async () => {
            try {
                const settings = await window.settingAPI.loadSettingObject();
                registerConversationFind(settings);
                const fontPreset = settings?.gui_config?.font_preset || 'default';
                document.documentElement.setAttribute('data-font-preset', fontPreset);

                const sidebarWidth = settings?.gui_config?.sidebar_width;
                if (typeof sidebarWidth === 'number') {
                    const splitter = document.querySelector('splitter-widget');
                    if (splitter) {
                        splitter.setAttribute('initial-width', String(sidebarWidth));
                    }
                }
            } catch {}
        })();

        // 监听侧边栏宽度变化并持久化保存
        let _sidebarSaveTimer = null;
        document.addEventListener('splitter-resize', (e) => {
            const width = e.detail?.width;
            if (typeof width !== 'number') return;
            // 防抖：拖拽停止 300ms 后才保存
            clearTimeout(_sidebarSaveTimer);
            _sidebarSaveTimer = setTimeout(async () => {
                try {
                    const settings = await window.settingAPI.loadSettingObject();
                    const guiConfig = { ...(settings.gui_config || {}), sidebar_width: width };
                    await window.settingAPI.saveSettingObject({ ...settings, gui_config: guiConfig });
                } catch (err) {
                    console.warn('[sidebar] failed to save sidebar width:', err);
                }
            }, 300);
        });

        document.getElementById('shortcut-help-btn')?.addEventListener('click', () => {
            const panel = document.getElementById('shortcut-help-panel');
            if (panel && typeof panel.toggle === 'function') {
                panel.toggle();
            }
        });

        (function () {
            var nonAppSlot = null;
            var appFramesContainer = null;
            var appFrameCache = {};
            var taskViewCache = {};
            // 任务最近访问时间戳（taskId -> Date.now()），仅存内存不落盘；
            // 点击打开任务时由 openTask() 更新，供 LRU 驻留数量上限淘汰使用。
            var taskViewLastAccess = {};
            var currentNonAppContent = null; // 'home' | 'task:xxx' | 'setting' | 'memory' | 'logview'
            var currentOpenAppBundleName = null; // 当前打开的应用包名，用于版本更新时自动重载

            // 广播字体设置给所有 iframe
            window.broadcastFontSettings = function (fontPreset) {
                console.log('[broadcastFontSettings] called with preset:', fontPreset);
                console.log('[broadcastFontSettings] appFrameCache keys:', Object.keys(appFrameCache));
                Object.values(appFrameCache).forEach(function (frame) {
                    var cw = getAppSubFrameWindow(frame);
                    if (cw) {
                        cw.postMessage(
                            {
                                type: 'FONT_SETTINGS',
                                fontPreset: fontPreset
                            },
                            '*'
                        );
                    }
                });
            };

            function ensureSlots() {
                if (nonAppSlot && appFramesContainer) return;
                nonAppSlot = document.getElementById('nonAppSlot');
                appFramesContainer = document.getElementById('app-frames-container');
                if (!nonAppSlot || !appFramesContainer) return;
                if (!window.__appFrameCache) window.__appFrameCache = {};
                appFrameCache = window.__appFrameCache;
            }

            function showNonApp() {
                ensureSlots();
                // 切到任务/主页/设置等非应用视图后，应用启动占位不再有意义，别让它盖住新视图
                finishAppLaunchLoading();
                currentOpenAppBundleName = null;
                if (nonAppSlot) nonAppSlot.style.display = '';
                if (appFramesContainer) appFramesContainer.style.display = 'none';
                notifyViewChanged(currentNonAppContent);
            }

            function showAppFrames() {
                ensureSlots();
                // 隐藏原页面，保留后台 Browser Use 的 webview 渲染。
                hideAllNonAppChildren(true);
                currentNonAppContent = null;
                if (appFramesContainer) appFramesContainer.style.display = 'block';
                notifyViewChanged('application', currentOpenAppBundleName);
            }

            /**
             * 等待指定应用自身就绪（不再等全局屏障：遥测、其它应用的延迟加载都在后台跑）。
             * 失败时撤掉启动占位并把错误抛给调用方。
             */
            async function ensureApplicationReady(bundleName) {
                try {
                    await window.applicationRegistryAPI.ensureApplicationLoaded(bundleName);
                } catch (err) {
                    finishAppLaunchLoading(bundleName);
                    throw err;
                }
            }

            /** 只广播前台视图，避免隐藏容器保留的页面状态影响导航激活态。 */
            function notifyViewChanged(view, appBundle = null) {
                window.dispatchEvent(
                    new CustomEvent('od-view-changed', {
                        detail: {
                            view: view,
                            appBundle: appBundle
                        }
                    })
                );
            }

            /** 外部（用户安装）应用：自己提供 entryUrl，且不会回传就绪信号。 */
            function isExternalApplication(appGuiConfig) {
                return !!(appGuiConfig && appGuiConfig.source === 'user' && appGuiConfig.entryUrl);
            }

            /**
             * 应用 iframe 的地址：外部应用直接指向自己的 entryUrl，内置应用统一走
             * application.html 壳页面。打开应用与版本更新重载共用同一份判定。
             */
            function resolveAppFrameSrc(bundleName, appGuiConfig) {
                return isExternalApplication(appGuiConfig)
                    ? appGuiConfig.entryUrl
                    : './application.html?applicationBundleName=' + encodeURIComponent(bundleName);
            }

            // ── 应用启动占位 ───────────────────────────────────────────────────
            // 首次打开应用要先等主进程加载该应用的延迟资源，再等 iframe 冷启动（模块图解析），
            // 这段时间界面看起来毫无反应。打开前先挂占位，应用首屏挂载后再撤掉。
            var appLaunchLoadingTimeoutMs = 15000;
            var appLaunchLoadingEl = null;
            var appLaunchLoadingBundle = null;
            var appLaunchLoadingTimer = null;

            /** iframe 首屏是否已落地（内置应用收到 APPLICATION_READY，外部应用 load 完成）。 */
            function markAppFrameReady(frame) {
                if (frame) frame.setAttribute('data-app-ready', '1');
            }

            function isAppFrameReady(frame) {
                return !!frame && frame.getAttribute('data-app-ready') === '1';
            }

            function startAppLaunchLoading(bundleName) {
                ensureSlots();
                finishAppLaunchLoading();
                var parent = nonAppSlot ? nonAppSlot.parentElement : null;
                if (!parent) return;
                var el = document.createElement('content-loading-view');
                el.setAttribute('data-type', 'tb');
                if (window.__odT) {
                    el.setAttribute('data-message', window.__odT('renderer.application.loading'));
                }
                el.style.cssText =
                    'position:absolute;inset:0;z-index:50;width:100%;height:100%;background:var(--od-bg,#f5f5f5);';
                parent.appendChild(el);
                appLaunchLoadingEl = el;
                appLaunchLoadingBundle = bundleName;
                // 兜底：外部应用或异常路径拿不到就绪信号，超时也必须撤掉占位
                appLaunchLoadingTimer = setTimeout(function () {
                    finishAppLaunchLoading(bundleName);
                }, appLaunchLoadingTimeoutMs);
            }

            /** 撤掉启动占位；传 bundleName 时只撤该应用的占位，避免误伤后打开的应用。 */
            function finishAppLaunchLoading(bundleName) {
                var el = appLaunchLoadingEl;
                if (!el) return;
                if (bundleName && appLaunchLoadingBundle && appLaunchLoadingBundle !== bundleName) return;
                // 定时器必须随占位一起撤销：否则它会在同一应用下次打开时提前撤掉新占位
                if (appLaunchLoadingTimer !== null) {
                    clearTimeout(appLaunchLoadingTimer);
                    appLaunchLoadingTimer = null;
                }
                appLaunchLoadingEl = null;
                appLaunchLoadingBundle = null;
                // 淡出期间不再拦截点击，避免应用刚出来时第一次点击被占位吞掉
                el.style.pointerEvents = 'none';
                el.style.transition = 'opacity 0.2s ease-out';
                el.style.opacity = '0';
                var removed = false;
                var remove = function () {
                    if (removed) return;
                    removed = true;
                    el.remove();
                };
                el.addEventListener('transitionend', remove, { once: true });
                setTimeout(remove, 300);
            }

            /**
             * 隐藏 nonAppSlot 中所有直接子元素
             */
            function hideAllNonAppChildren(keepBackgroundTasks = false) {
                if (!nonAppSlot) return;
                for (var i = 0; i < nonAppSlot.children.length; i++) {
                    var child = nonAppSlot.children[i];
                    if (keepBackgroundTasks && child.tagName === 'TASK-VIEW' && child.hasAttribute('data-background')) {
                        continue;
                    }
                    child.style.display = 'none';
                    if (child.tagName === 'TASK-VIEW' && typeof child.markViewHidden === 'function') {
                        // 记录进入后台的时间，供后台超时释放扫描使用。
                        // 隐性契约：所有显示 task-view 的路径必须统一走 openTask()
                        // （其中会配对调用 markViewShown），否则当前可见的视图会因
                        // 未清除后台计时而被 sweepStaleTaskViews 误杀。
                        child.markViewHidden();
                    }
                }
            }

            /**
             * 清除非 task-view 的临时内容（如 home-page、setting-editor、personal-center、log-view）
             */
            function clearNonTaskContent() {
                if (!nonAppSlot) return;
                var toRemove = [];
                for (var i = 0; i < nonAppSlot.children.length; i++) {
                    var child = nonAppSlot.children[i];
                    if (!child.hasAttribute('data-task-view-cached') && !child.hasAttribute('data-inline-app')) {
                        toRemove.push(child);
                    }
                }
                for (var j = 0; j < toRemove.length; j++) {
                    nonAppSlot.removeChild(toRemove[j]);
                }
            }

            /**
             * 统一关闭工作区预览状态。
             */
            function closeAllEditorOverlays() {
                var artifacts = document.querySelectorAll('task-artifacts');
                artifacts.forEach(function (el) {
                    if (typeof el.suspendPreviewLayout === 'function') {
                        el.suspendPreviewLayout();
                    } else if (typeof el.closeEditor === 'function') {
                        el.closeEditor();
                    }
                });
            }

            // 左侧边栏展开只改变导航可见性，保留各任务的预览内容和布局。

            async function openTask(taskId) {
                // 单一入口防御：拦截非法 taskId（典型如调用方误传 undefined，
                // setAttribute 后会变成字符串 "undefined"，导致 getFullTask 报
                // "task undefined not found" 并卡在加载占位白屏）。统一回退主页语义。
                if (taskId !== null && (typeof taskId !== 'string' || !taskId || taskId === 'undefined')) {
                    console.error('openTask: invalid taskId:', taskId);
                    taskId = null;
                }
                ensureSlots();
                var loadingEl = null;
                if (taskId !== null) {
                    // 任务加载 + 首屏渲染期间，用跑步上岗占位覆盖整个过程
                    hideAllNonAppChildren();
                    loadingEl = document.createElement('content-loading-view');
                    loadingEl.setAttribute('data-type', 'tb');
                    if (window.__odT) {
                        loadingEl.setAttribute('data-message', window.__odT('renderer.task.loading'));
                    }
                    loadingEl.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(loadingEl);
                    if (appFramesContainer) appFramesContainer.style.display = 'none';
                    nonAppSlot.style.display = '';
                    await window.applicationRegistryAPI.ensureFullyLoaded();
                    // 提升 loading 到覆盖层，让内容在下方渲染（脱离 nonAppSlot 后不受 clear/hide 影响）
                    var overlayParent = nonAppSlot.parentElement;
                    if (overlayParent) {
                        overlayParent.appendChild(loadingEl);
                        loadingEl.style.cssText = 'position:absolute;inset:0;z-index:50;width:100%;height:100%;';
                    }
                }
                window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed');
                // 切换任务前关闭所有编辑器覆盖层
                closeAllEditorOverlays();
                hideAllNonAppChildren();

                var contentReady = Promise.resolve();
                try {
                    if (taskId === null) {
                        clearNonTaskContent();
                        var homePage = document.createElement('home-page');
                        homePage.id = 'home-page';
                        homePage.className = 'h-full w-full';
                        homePage.style.cssText = 'width:100%;height:100%;';
                        nonAppSlot.appendChild(homePage);
                        currentNonAppContent = 'home';
                        currentOpenAppBundleName = null;
                    } else {
                        clearNonTaskContent();
                        // 点击打开任务即视为一次访问，刷新最近访问时间（仅内存）
                        taskViewLastAccess[taskId] = Date.now();
                        var isNewTaskView = !taskViewCache[taskId];
                        if (isNewTaskView) {
                            var el = document.createElement('task-view');
                            el.setAttribute('task_id', taskId);
                            el.setAttribute('data-task-view-cached', '1');
                            el.style.cssText = 'width:100%;height:100%;';
                            nonAppSlot.appendChild(el);
                            taskViewCache[taskId] = el;
                        }
                        var tv = taskViewCache[taskId];
                        tv.removeAttribute('data-background');
                        tv.style.cssText = 'width:100%;height:100%;';
                        tv.style.display = '';
                        if (typeof tv.markViewShown === 'function') {
                            tv.markViewShown();
                        }
                        // 等待首屏内容就绪信号（reload 完成时由 task-view 派发）；
                        // 超时兜底，防止异常路径下占位永不消失。
                        contentReady = new Promise(function (resolve) {
                            var done = false;
                            var finish = function () {
                                if (done) return;
                                done = true;
                                tv.removeEventListener('task-view-content-ready', finish);
                                resolve();
                            };
                            tv.addEventListener('task-view-content-ready', finish, { once: true });
                            setTimeout(finish, 10000);
                        });
                        // 切回缓存视图时，调用 reload() 补齐后台运行期间跳过的更新
                        if (!isNewTaskView) {
                            // reload 失败（如任务刚被清理）不应产生未捕获 rejection
                            tv.reload().catch(function (err) {
                                console.error('Failed to reload task view for ' + taskId + ':', err);
                            });
                        }
                        if (taskViewCache[taskId].syncRightSidebarState) {
                            taskViewCache[taskId].syncRightSidebarState();
                        }
                        currentNonAppContent = 'task:' + taskId;
                    }
                } finally {
                    showNonApp();
                }
                if (loadingEl) {
                    await contentReady;
                    // 淡出占位：内容已在下方渲染完成
                    void loadingEl.offsetHeight; // force reflow
                    loadingEl.style.transition = 'opacity 0.25s ease-out';
                    loadingEl.style.opacity = '0';
                    var __done = false;
                    var __cleanup = function () {
                        if (__done) return;
                        __done = true;
                        loadingEl.remove();
                    };
                    loadingEl.addEventListener('transitionend', __cleanup, { once: true });
                    setTimeout(__cleanup, 400);
                }
                // 统一同步侧边栏活跃任务高亮（所有打开任务的入口都经由 openTask）；
                // revealCurrentTask 会让侧边栏自动展开任务所在分组并滚动到可见，
                // 避免任务在折叠分组或列表深处时用户找不到高亮任务
                var sidebar = document.getElementById('main-sidebar');
                if (sidebar) {
                    sidebar.currentTaskId = taskId;
                    if (typeof sidebar._updateTaskHighlight === 'function') {
                        sidebar._updateTaskHighlight(taskId, { revealCurrentTask: taskId !== null });
                    }
                }
                // 打开任务后立即按 LRU 上限修剪，让驻留数量限制即时生效
                if (taskId !== null) {
                    sweepExcessTaskViews();
                }
            }

            async function needsWizard() {
                try {
                    var data = await window.settingAPI.loadSettingObject();
                    if (data.providers && data.providers.length > 0) {
                        return false;
                    }
                    if (window.accountAPI && (await window.accountAPI.isSetupComplete())) {
                        return false;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function openHomePage(skipWizard) {
                ensureSlots();
                closeAllEditorOverlays();
                window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed');
                hideAllNonAppChildren();
                clearNonTaskContent();
                var homePage = document.createElement('home-page');
                homePage.id = 'home-page';
                homePage.className = 'h-full w-full';
                homePage.style.cssText = 'width:100%;height:100%;';
                nonAppSlot.appendChild(homePage);
                currentNonAppContent = 'home';
                currentOpenAppBundleName = null;
                showNonApp();
                if (!skipWizard) {
                    needsWizard().then(function (needs) {
                        if (needs) {
                            window.globalControlAPI.openWizard();
                        }
                    });
                }
            }

            function getWizardReturnLabel() {
                return '返回设置';
            }

            function returnFromWizard() {
                window.globalControlAPI.openSettingEditor();
            }

            /**
             * 当任务被删除时，从缓存中清除对应的 task-view
             */
            function removeTaskViewCache(taskId) {
                if (taskViewCache[taskId]) {
                    if (taskViewCache[taskId].parentNode) {
                        taskViewCache[taskId].parentNode.removeChild(taskViewCache[taskId]);
                    }
                    delete taskViewCache[taskId];
                }
                delete taskViewLastAccess[taskId];
                // 前台关闭/驱逐该任务视图后，通知 main 回收其重量级内存（chat_context 等）。
                // 切换任务（openTask）只隐藏视图、不销毁缓存，因此不会走到这里。
                if (window.taskManagerAPI && typeof window.taskManagerAPI.releaseTaskMemory === 'function') {
                    void window.taskManagerAPI.releaseTaskMemory(taskId).catch(function () {});
                }
            }

            /**
             * 清除所有 task-view 缓存
             */
            function clearAllTaskViewCache() {
                Object.keys(taskViewCache).forEach(function (tid) {
                    removeTaskViewCache(tid);
                });
            }

            /**
             * 释放长时间未显示的后台任务视图。
             * 切换任务只隐藏不销毁，长会话的整棵 DOM 会持续驻留；不可见超过
             * TASK_VIEW_BACKGROUND_RELEASE_MS（10 分钟）且任务非运行态的视图整体销毁（disconnectedCallback 内完成
             * 订阅退订与缓存清理，内存可被回收），下次打开时重新创建并全量加载。
             * 运行中任务跳过：后台工具（如浏览器自动化）可能正在使用视图内组件，
             * 任务结束后的下一轮扫描会将其释放。
             */
            function sweepStaleTaskViews() {
                var now = Date.now();
                Object.keys(taskViewCache).forEach(function (tid) {
                    var tv = taskViewCache[tid];
                    if (tv && typeof tv.shouldReleaseInBackground === 'function' && tv.shouldReleaseInBackground(now)) {
                        removeTaskViewCache(tid);
                    }
                });
            }

            /**
             * LRU 数量上限淘汰：驻留的 task-view 数量超过 MAX_RESIDENT_TASK_VIEWS 时，
             * 销毁最近访问时间最久（且非前台显示、非运行中、消息队列为空）的多余视图，
             * 下次打开该任务时重新创建并全量加载。与超时释放互补：即使没有打开新任务，
             * 周期扫描也会保持驻留数量不超过上限。
             */
            function sweepExcessTaskViews() {
                var entries = Object.keys(taskViewCache).map(function (tid) {
                    var tv = taskViewCache[tid];
                    return {
                        taskId: tid,
                        lastAccessAt: taskViewLastAccess[tid] || 0,
                        isActive:
                            currentNonAppContent === 'task:' + tid && nonAppSlot && nonAppSlot.style.display !== 'none',
                        isRunning: !!(tv && tv.task_status === 'running'),
                        hasQueuedMessages: !!(
                            tv &&
                            typeof tv.hasQueuedMessages === 'function' &&
                            tv.hasQueuedMessages()
                        )
                    };
                });
                selectTaskViewsToEvict(entries, MAX_RESIDENT_TASK_VIEWS).forEach(function (tid) {
                    removeTaskViewCache(tid);
                });
            }

            setInterval(function () {
                sweepStaleTaskViews();
                sweepExcessTaskViews();
            }, 60 * 1000);

            window.settingAPI.registerCommandCallback('openHomePage', openHomePage);
            window.settingAPI.registerCommandCallback('openTask', function (taskId) {
                return openTask(taskId);
            });
            window.settingAPI.registerCommandCallback('openSettingEditor', function () {
                window.globalControlAPI.openSettingEditor();
            });

            async function updateMaximizeIcon() {
                const isMaximized = await window.settingAPI.isMaximized();
                const maximizeButton = document.getElementById('maximize-btn');
                if (maximizeButton) {
                    // 最大化态换成「双框」图标：两个 SVG 都在按钮内，由 CSS 按该状态类切换显隐
                    maximizeButton.classList.toggle('is-maximized', isMaximized);
                }
            }
            window.updateMaximizeIcon = updateMaximizeIcon;
            window.addEventListener('resize', updateMaximizeIcon);
            updateMaximizeIcon();
            // 主进程在 maximize/unmaximize 事件时推送真实状态：X11 下 WM 异步
            // 应用最大化，双击后立即回查拿到的还是旧值，靠 resize 兜底也不够
            // （尺寸未变时无 resize）。订阅推送保证图标与自绘圆角及时同步。
            if (window.settingAPI.onMaximizeStateChanged) {
                window.settingAPI.onMaximizeStateChanged(function () {
                    updateMaximizeIcon();
                    if (window.updateWindowShape) window.updateWindowShape();
                });
            }

            // Linux 无边框窗口自绘圆角：最大化/全屏时取消圆角
            if (window.systemInfo && window.systemInfo.isLinux) {
                async function updateWindowShape() {
                    var maximized = false;
                    var fullscreen = false;
                    try {
                        maximized = !!(await window.settingAPI.isMaximized());
                        fullscreen = !!(await window.settingAPI.isFullScreen());
                    } catch (e) {
                        return;
                    }
                    document.documentElement.classList.toggle('window-maximized', maximized);
                    document.documentElement.classList.toggle('window-fullscreen', fullscreen);
                }
                window.updateWindowShape = updateWindowShape;
                window.addEventListener('resize', updateWindowShape);
                updateWindowShape();
                // 缩放偏好变更时 main 重设 zoom factor 并推送新值，阴影边距随之反算
                if (window.displayAPI && typeof window.displayAPI.onScaleFactorChanged === 'function') {
                    window.displayAPI.onScaleFactorChanged(function (factor) {
                        document.documentElement.style.setProperty('--od-window-zoom', String(factor || 1));
                    });
                }
                // Linux 上 drag region 无系统级双击最大化（仅发送 _NET_WM_MOVERESIZE
                // 拖动请求），行为取决于窗口管理器且不稳定，这里手动监听双击。
                // 同时拖拽层被覆盖为 no-drag（见 titlebar.css），拖动与右键也
                // 一并手动处理：拖动通知主进程移动窗口（鼠标由主进程轮询光标，
                // 触摸屏/手写笔由本侧上报坐标）；右键 preventDefault
                // 阻止 Chromium 默认行为（GTK 标题栏右键系统菜单已被 no-drag 消除）。
                var dragOverlay = document.querySelector('.drag-overlay');
                if (dragOverlay) {
                    dragOverlay.addEventListener('dblclick', function (event) {
                        // 窗口控制按钮为 no-drag，双击会冒泡至此，需交回按钮自身处理
                        if (event.target instanceof Element && event.target.closest('button')) return;
                        window.settingAPI.maximizeMainWindow().then(function () {
                            updateMaximizeIcon();
                            if (window.updateWindowShape) window.updateWindowShape();
                        });
                    });
                    dragOverlay.addEventListener('contextmenu', function (event) {
                        event.preventDefault();
                    });
                    // 拖动采用「按下记录 + 移动超阈值才启动」：单击（无位移）不触发
                    // 窗口还原/跳位，双击最大化与单击聚焦等行为不受影响；确认为拖动
                    // 后再通知主进程（携带按下点，保持按下点相对窗口位置不变）。
                    // 驱动来源按 pointerType 分流：鼠标交给主进程轮询系统光标（手指
                    // 拖出窗口也能跟随）；触摸屏/手写笔不会更新系统光标，轮询取到的
                    // 始终是陈旧坐标，改由本侧 pointermove 上报窗口内坐标驱动。
                    var dragPointerState = null;
                    var DRAG_THRESHOLD = 4;
                    // 触摸双击（双击顶部最大化）判定：Chromium 不为触摸派发 dblclick，
                    // 只能按「两次紧凑轻点（期间未拖动）」自行识别
                    var DOUBLE_TAP_MS = 400;
                    var DOUBLE_TAP_SLOP = 40;
                    var lastTapAt = 0;
                    var lastTapX = 0;
                    var lastTapY = 0;
                    // pointer 驱动的坐标按帧合并上报：触摸屏 pointermove 可达 240Hz，
                    // 逐条 IPC + setBounds 会让主进程排队积压（表现为不跟手后拖不动）
                    var pendingDragPoint = null;
                    var dragRafId = 0;
                    var resetDragPoint = function () {
                        if (dragRafId) {
                            cancelAnimationFrame(dragRafId);
                            dragRafId = 0;
                        }
                        pendingDragPoint = null;
                    };
                    var flushDragPoint = function () {
                        dragRafId = 0;
                        var point = pendingDragPoint;
                        pendingDragPoint = null;
                        if (point && window.windowDragAPI) {
                            window.windowDragAPI.move(point.x, point.y);
                        }
                    };
                    dragOverlay.addEventListener('pointerdown', function (event) {
                        if (event.button !== 0) return;
                        if (event.target instanceof Element && event.target.closest('button')) return;
                        event.preventDefault();
                        if (
                            event.pointerType !== 'mouse' &&
                            lastTapAt !== 0 &&
                            event.timeStamp - lastTapAt < DOUBLE_TAP_MS &&
                            Math.abs(event.clientX - lastTapX) < DOUBLE_TAP_SLOP &&
                            Math.abs(event.clientY - lastTapY) < DOUBLE_TAP_SLOP
                        ) {
                            // 第二次轻点：取消待拖动状态直接最大化
                            lastTapAt = 0;
                            dragPointerState = null;
                            window.settingAPI.maximizeMainWindow().then(function () {
                                updateMaximizeIcon();
                                if (window.updateWindowShape) window.updateWindowShape();
                            });
                            return;
                        }
                        lastTapAt = event.timeStamp;
                        lastTapX = event.clientX;
                        lastTapY = event.clientY;
                        try {
                            dragOverlay.setPointerCapture(event.pointerId);
                        } catch (e) {

                        }
                        dragPointerState = {
                            pointerId: event.pointerId,
                            driver: event.pointerType === 'mouse' ? 'cursor' : 'pointer',
                            startX: event.clientX,
                            startY: event.clientY,
                            started: false
                        };
                    });
                    dragOverlay.addEventListener('pointermove', function (event) {
                        // 多指同按：只跟随发起拖动的那根手指
                        if (!dragPointerState || event.pointerId !== dragPointerState.pointerId) return;
                        if (!dragPointerState.started) {
                            if (
                                Math.abs(event.clientX - dragPointerState.startX) > DRAG_THRESHOLD ||
                                Math.abs(event.clientY - dragPointerState.startY) > DRAG_THRESHOLD
                            ) {
                                dragPointerState.started = true;
                                if (window.windowDragAPI) {
                                    window.windowDragAPI.start(
                                        dragPointerState.startX,
                                        dragPointerState.startY,
                                        dragPointerState.driver
                                    );
                                }
                            }
                            return;
                        }
                        if (dragPointerState.driver !== 'pointer' || !window.windowDragAPI) return;
                        // 上报窗口内坐标（触摸的 screenX 在 X11 下不可靠），主进程
                        // 结合已应用位移换算并把按下点贴回手指下
                        pendingDragPoint = { x: event.clientX, y: event.clientY };
                        if (!dragRafId) dragRafId = requestAnimationFrame(flushDragPoint);
                    });
                    var endWindowDrag = function (event) {
                        if (dragPointerState && event.pointerId !== dragPointerState.pointerId) return;
                        if (dragPointerState && dragPointerState.started && window.windowDragAPI) {
                            resetDragPoint();
                            window.windowDragAPI.end();
                        }
                        dragPointerState = null;
                    };
                    dragOverlay.addEventListener('pointerup', endWindowDrag);

                }

                import('./components/windowShadowResize.js').then(function (m) {
                    m.installShadowResizeHandles();
                });
            }

            /**
             * 确保指定任务的 task-view 存在（用于后台任务需要浏览器等 UI 组件的场景）。
             * 如果 task-view 尚未创建，则创建并以不可见方式挂载，
             * 使其内部的 webview 等组件能正常工作而不影响当前用户界面。
             */
            async function ensureTaskViewExists(taskId) {
                await window.applicationRegistryAPI.ensureFullyLoaded();
                ensureSlots();
                if (taskViewCache[taskId]) return;
                var el = document.createElement('task-view');
                el.setAttribute('task_id', taskId);
                el.setAttribute('data-task-view-cached', '1');
                el.setAttribute('data-background', '1');
                el.style.cssText =
                    'position:fixed;left:0;top:0;width:1280px;height:800px;opacity:0;pointer-events:none;z-index:-1;';
                nonAppSlot.appendChild(el);
                taskViewCache[taskId] = el;
                if (typeof el.markViewHidden === 'function') {
                    // 后台挂载视图同样参与超时释放扫描
                    el.markViewHidden();
                }
            }

            window.globalControlAPI = {
                ensureTaskViewExists: ensureTaskViewExists,
                openImmersiveDesktop: function () {
                    return window.openDeskDesktop?.open?.();
                },
                closeImmersiveDesktop: function () {
                    window.openDeskDesktop?.close?.();
                },
                openWizard: function () {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setup-wizard');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'wizard';
                    showNonApp();
                },
                returnFromWizard: returnFromWizard,
                getWizardReturnLabel: getWizardReturnLabel,
                openSettingEditor: function (options) {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setting-panel');
                    if (options && options.tab === 'models') {
                        el.setAttribute('initial-tab', 'models');
                    } else if (options && options.tab === 'general') {
                        el.setAttribute('initial-tab', 'general');
                    }
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'setting';
                    showNonApp();
                },
                openAdvancedSettingEditor: function () {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('setting-editor');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'setting';
                    showNonApp();
                },
                openLogView: function () {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('log-view');
                    el.style.cssText = 'width:100%;height:100%;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'logview';
                    showNonApp();
                },
                openPersonalCenter: function () {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('personal-center');
                    el.style.cssText = 'width:100%;height:100%;display:block;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'personal-center';
                    showNonApp();
                },
                openMemory: function () {
                    ensureSlots();
                    closeAllEditorOverlays();
                    hideAllNonAppChildren();
                    clearNonTaskContent();
                    var el = document.createElement('memory-panel');
                    el.style.cssText = 'width:100%;height:100%;display:block;';
                    nonAppSlot.appendChild(el);
                    currentNonAppContent = 'memory';
                    showNonApp();
                },
                openTask: openTask,
                openHomePage: openHomePage,
                removeTaskViewCache: removeTaskViewCache,
                clearAllTaskViewCache: clearAllTaskViewCache,
                openApplication: async function (bundleName, options) {
                    ensureSlots();
                    closeAllEditorOverlays();
                    // 首屏已就绪的驻留 iframe 切回来是瞬时的；浏览器应用是内联挂载；两者都不需要占位
                    if (bundleName !== 'browser' && !isAppFrameReady(appFrameCache[bundleName])) {
                        startAppLaunchLoading(bundleName);
                    }
                    await ensureApplicationReady(bundleName);
                    var appGuiConfig = null;
                    try {
                        appGuiConfig = await window.applicationRegistryAPI.getApplicationGUIConfig(bundleName);
                    } catch (err) {
                        console.warn('Failed to get application GUI config', bundleName, err);
                    }
                    if (appGuiConfig && appGuiConfig.isExperimental) {
                        try {
                            var setting = await window.settingAPI.loadSettingObject();
                            if (
                                !isExperimentalApplicationEnabled(
                                    appGuiConfig,
                                    setting && setting.debug && setting.debug.experimental_features
                                )
                            ) {
                                finishAppLaunchLoading(bundleName);
                                return;
                            }
                        } catch (err) {
                            console.warn('Failed to check experimental application access', bundleName, err);
                            finishAppLaunchLoading(bundleName);
                            return;
                        }
                    }
                    // 通知 sidebar 清除任务高亮（因为切换到了其他应用）
                    document.dispatchEvent(
                        new CustomEvent('application-opened', { detail: { bundleName: bundleName, options: options } })
                    );
                    // 如果切换到其他应用，通知邮箱应用用户已离开
                    if (bundleName !== 'mailbox') {
                        window.applicationRegistryAPI.call('mailbox', 'notifyMailboxClosed').catch(function () {});
                    } else {
                        window.applicationRegistryAPI.call('mailbox', 'notifyMailboxOpened').catch(function () {});
                    }

                    // 浏览器应用需要直接挂载在主窗口中（webview 标签在 iframe 中不可用），
                    // 使用 nonAppSlot 而非 iframe 来承载。
                    if (bundleName === 'browser') {
                        hideAllNonAppChildren();
                        clearNonTaskContent();
                        var existingBrowser = nonAppSlot.querySelector('browser-entry-widget');
                        if (!existingBrowser) {
                            var el = document.createElement('browser-entry-widget');
                            el.style.cssText = 'width:100%;height:100%;';
                            el.setAttribute('data-inline-app', 'browser');
                            el.setAttribute('data-od-widget', '');
                            nonAppSlot.appendChild(el);
                        } else {
                            existingBrowser.style.display = '';
                        }
                        currentNonAppContent = 'browser';
                        currentOpenAppBundleName = 'browser';
                        // showNonApp 内部会撤掉可能残留的启动占位
                        showNonApp();
                        return;
                    }

                    var isExternalApp = isExternalApplication(appGuiConfig);
                    var frameSrc = resolveAppFrameSrc(bundleName, appGuiConfig);
                    // NOTE: highlightEventId is sent via postMessage (not URL hash) to avoid
                    // iframe rebuild when the ID changes (different frameSrc = cache invalidated)
                    if (
                        appFrameCache[bundleName] &&
                        appFrameCache[bundleName].getAttribute('data-entry-url') !== frameSrc
                    ) {
                        appFrameCache[bundleName].remove();
                        delete appFrameCache[bundleName];
                    }

                    if (!appFrameCache[bundleName]) {
                        // 版本变化导致旧 iframe 被移除时也要重新给出加载反馈
                        if (!appLaunchLoadingEl) startAppLaunchLoading(bundleName);
                        var iframe = document.createElement('iframe');
                        iframe.className = 'w-full h-full';
                        iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:0;';
                        iframe.src = frameSrc;
                        iframe.setAttribute('data-entry-url', frameSrc);
                        // 外部应用页面不会回传 APPLICATION_READY，按 iframe load 判定就绪
                        if (isExternalApp) iframe.setAttribute('data-external-app', '1');
                        iframe.onload = function () {
                            if (iframe.getAttribute('data-external-app') === '1') {
                                markAppFrameReady(iframe);
                                finishAppLaunchLoading(bundleName);
                            }
                            var cw = getAppSubFrameWindow(iframe);
                            var currentPreset = document.documentElement.getAttribute('data-font-preset');
                            if (currentPreset && cw) {
                                cw.postMessage({ type: 'FONT_SETTINGS', fontPreset: currentPreset }, '*');
                            }
                            var currentTheme = document.documentElement.dataset.theme;
                            if (currentTheme && cw) {
                                postThemeToWindow(cw, currentTheme);
                            }
                            // Send HIGHLIGHT_EVENT after a short delay to ensure entry.ts is initialized
                            if (options && options.highlightEventId && cw) {
                                setTimeout(function () {
                                    cw.postMessage(
                                        { type: 'HIGHLIGHT_EVENT', highlightEventId: options.highlightEventId },
                                        '*'
                                    );
                                }, 500);
                            }
                            // For agentgate: always navigate to dashboard tab on open
                            if (bundleName === 'agentgate' && cw) {
                                setTimeout(function () {
                                    cw.postMessage({ type: 'NAVIGATE_TO_DASHBOARD' }, '*');
                                }, 300);
                            }
                        };
                        appFramesContainer.appendChild(iframe);
                        appFrameCache[bundleName] = iframe;
                    }
                    Object.keys(appFrameCache).forEach(function (name) {
                        appFrameCache[name].style.display = name === bundleName ? 'block' : 'none';
                        if (name === bundleName) {
                            syncThemeToAppFrame(appFrameCache[name]);
                            // If iframe is cached and options have highlightEventId, postMessage to it
                            if (options && options.highlightEventId) {
                                var cw = getAppSubFrameWindow(appFrameCache[name]);
                                if (cw) {
                                    cw.postMessage(
                                        { type: 'HIGHLIGHT_EVENT', highlightEventId: options.highlightEventId },
                                        '*'
                                    );
                                }
                            }
                            // For agentgate: always navigate to dashboard tab when opening (even without highlightEventId)
                            if (name === 'agentgate') {
                                var cw2 = getAppSubFrameWindow(appFrameCache[name]);
                                if (cw2) {
                                    cw2.postMessage({ type: 'NAVIGATE_TO_DASHBOARD' }, '*');
                                }
                            }
                        }
                    });
                    currentOpenAppBundleName = bundleName;
                    showAppFrames();
                    // 首屏已落地的驻留 iframe 切回来是瞬时的，直接撤占位；
                    // 首次启动（或仍在冷启动）的 iframe 交给就绪信号 / 超时收尾
                    if (isAppFrameReady(appFrameCache[bundleName])) finishAppLaunchLoading(bundleName);
                }
            };

            // 监听应用列表变更，如果当前打开的应用版本已更新，自动重载 iframe
            if (window.applicationRegistryAPI?.onApplicationListChanged) {
                window.applicationRegistryAPI.onApplicationListChanged(async function () {
                    var bundleName = currentOpenAppBundleName;
                    if (!bundleName) return;
                    // 浏览器应用不使用 iframe 缓存机制，无需处理
                    if (bundleName === 'browser') return;
                    try {
                        var appGuiConfig = await window.applicationRegistryAPI.getApplicationGUIConfig(bundleName);
                        if (!appGuiConfig) return;
                        var frameSrc = resolveAppFrameSrc(bundleName, appGuiConfig);
                        var cachedFrame = appFrameCache[bundleName];
                        if (cachedFrame && cachedFrame.getAttribute('data-entry-url') !== frameSrc) {
                            // 版本已更新：移除旧 iframe，下次 openApplication 会重新创建
                            cachedFrame.remove();
                            delete appFrameCache[bundleName];
                            // 重新触发 openApplication 以加载新版本
                            currentOpenAppBundleName = null;
                            window.globalControlAPI.openApplication(bundleName);
                        }
                    } catch (err) {
                        console.warn('[app-update] failed to check app version update:', err);
                    }
                });
            }

            // 监听来自 iframe（应用页）的 postMessage，支持应用内导航到任务、浮窗重置
            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'openTask' && event.data.taskId) {
                    openTask(event.data.taskId);
                }
                // 应用首屏已挂载（或加载失败）：标记该 iframe 就绪并撤掉启动加载占位。
                // bundleName 来自 iframe 消息，只认自有缓存项且来源窗口一致的那一个，
                // 避免别处（桌面浮窗 / 第三方应用页）的消息误撤占位或命中原型属性
                if (event.data && event.data.type === 'APPLICATION_READY') {
                    var readyBundle = event.data.bundleName;
                    var readyFrame =
                        typeof readyBundle === 'string' &&
                        Object.prototype.hasOwnProperty.call(appFrameCache, readyBundle)
                            ? appFrameCache[readyBundle]
                            : null;
                    if (readyFrame && event.source === readyFrame.contentWindow) {
                        markAppFrameReady(readyFrame);
                        finishAppLaunchLoading(readyBundle);
                    }
                }
                // 浮窗重置初始位置（来自 agentgate config 页）
                if (event.data && event.data.type === 'RESET_FLOATING_WINDOW_POSITION') {
                    var fwEl = document.getElementById('agentgate-floating-window');
                    if (fwEl && fwEl.resetPosition) fwEl.resetPosition();
                }
            });

            // 监听 setting locale 变化，向所有已打开的应用 iframe 发送 LOCALE_CHANGED
            if (window.settingAPI && window.settingAPI.onSettingChanged) {
                window.settingAPI.onSettingChanged(async function (data) {
                    var resolvedLocale = data && data.resolved_locale;
                    if (resolvedLocale) {
                        Object.keys(appFrameCache).forEach(function (bundleName) {
                            var cw = getAppSubFrameWindow(appFrameCache[bundleName]);
                            if (cw) {
                                cw.postMessage({ type: 'LOCALE_CHANGED', locale: resolvedLocale }, '*');
                            }
                        });
                    }
                    if (currentOpenAppBundleName) {
                        try {
                            var openAppConfig =
                                await window.applicationRegistryAPI.getApplicationGUIConfig(currentOpenAppBundleName);
                            if (
                                openAppConfig &&
                                !isExperimentalApplicationEnabled(
                                    openAppConfig,
                                    data && data.debug && data.debug.experimental_features
                                )
                            ) {
                                var hiddenBundleName = currentOpenAppBundleName;
                                if (appFrameCache[hiddenBundleName]) {
                                    appFrameCache[hiddenBundleName].remove();
                                    delete appFrameCache[hiddenBundleName];
                                }
                                openHomePage(true);
                            }
                        } catch (err) {
                            console.warn('[app-visibility] failed to close disabled experimental app', err);
                        }
                    }
                });
            }

            // 初始化时检查是否需要引导
            needsWizard().then(function (needs) {
                if (needs) {
                    window.globalControlAPI.openWizard();
                }
            });
        })();
    </script>
</html>
