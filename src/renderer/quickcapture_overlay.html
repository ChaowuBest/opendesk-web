<html>
    <head>
        <meta charset="UTF-8" />
        <title>OpenDesk Quick Capture</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000000;
                cursor: crosshair;
                user-select: none;
                -webkit-user-select: none;
                /* 触摸屏：禁止浏览器把手势识别成滚动/缩放，否则拖拽中会收到 pointercancel */
                touch-action: none;
                overscroll-behavior: none;
                font-family: var(--font-sans);
            }

            /* 遮罩显示前的整屏预截屏：挖洞处显示它（窗口不透明，触摸才可用）。
               尺寸由脚本按显示器 DIP 尺寸设置，任务栏所在区域会被窗口自然裁掉。 */
            #backdrop {
                position: absolute;
                left: 0;
                top: 0;
                object-fit: fill;
                pointer-events: none;
            }

            #overlay-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
            }

            /* Idle 提示条：与鸿蒙 ArkTS Column 的尺寸/颜色保持一致 */
            #hint {
                position: absolute;
                left: 50%;
                top: 40px;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 14px 22px;
                background: rgba(17, 19, 28, 0.72);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 20px;
                pointer-events: none;
            }

            #hint-title {
                color: #f3f4f6;
                font-size: 15px;
                line-height: 1.2;
                white-space: nowrap;
            }

            #hint-subtitle {
                color: rgba(243, 244, 246, 0.55);
                font-size: 12px;
                line-height: 1.2;
                white-space: nowrap;
            }

            /* 选区工具条：尺寸文案 + 取消 + 发送给 OpenDesk */
            #toolbar {
                position: absolute;
                display: none;
                align-items: center;
                gap: 10px;
                height: 44px;
                padding-right: 8px;
                border-radius: 22px;
                background: rgba(17, 19, 28, 0.94);
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            }

            #size-label {
                color: rgba(243, 244, 246, 0.75);
                font-size: 13px;
                line-height: 44px;
                padding: 0 2px 0 14px;
                text-align: center;
                white-space: nowrap;
            }

            .toolbar-button {
                appearance: none;
                border: none;
                height: 32px;
                border-radius: 16px;
                font-size: 14px;
                font-family: inherit;
                cursor: pointer;
                white-space: nowrap;
            }

            #cancel-button,
            #copy-button {
                color: #e5e7eb;
                background: rgba(255, 255, 255, 0.12);
                padding: 0 16px;
            }

            #send-button {
                color: #ffffff;
                font-weight: 500;
                padding: 0 18px;
                background: linear-gradient(135deg, #7c5cff 0%, #00c2ff 100%);
                box-shadow: 0 2px 14px rgba(124, 92, 255, 0.5);
            }

            /* Sent 提示：捕获尺寸与投递结果 */
            #sent-label {
                position: absolute;
                display: none;
                height: 40px;
                line-height: 40px;
                padding: 0 20px;
                border-radius: 20px;
                background: rgba(17, 19, 28, 0.94);
                border: 1px solid rgba(124, 92, 255, 0.5);
                color: #f3f4f6;
                font-size: 14px;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <img id="backdrop" alt="" draggable="false" />
        <canvas id="overlay-canvas"></canvas>

        <div id="hint">
            <div id="hint-title"></div>
            <div id="hint-subtitle"></div>
        </div>

        <div id="toolbar">
            <span id="size-label"></span>
            <button id="cancel-button" class="toolbar-button" type="button"></button>
            <button id="copy-button" class="toolbar-button" type="button"></button>
            <button id="send-button" class="toolbar-button" type="button"></button>
        </div>

        <div id="sent-label"></div>

        <script type="module" src="./quickcaptureOverlay.ts"></script>
    </body>
</html>
