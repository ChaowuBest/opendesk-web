<!doctype html>
<html lang="zh-CN">
    <head>
        <script>
            // 防止深色模式 FOUC：在首帧渲染前同步设置 data-theme
            (function () {
                var stored = localStorage.getItem('opendesk-theme-effective');
                if (stored === 'dark' || stored === 'light') {
                    document.documentElement.dataset.theme = stored;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.dataset.theme = 'dark';
                }
            })();
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OpenDesk</title>

        <link rel="stylesheet" href="./theme/theme.css" />
        <link rel="stylesheet" href="./styles/titlebar.css" />
        <link rel="stylesheet" href="./styles/common.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #app-iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
                background: var(--od-bg, #fff);
            }
            /* 启动占位：位置/尺寸盒子，动画与文案由 <content-loading-view> 自己渲染
               （与主窗口打开应用时的占位是同一个组件，观感一致） */
            #app-window-loading {
                position: absolute;
                inset: 0;
                z-index: 1;
                display: block;
                background: var(--od-bg, #fff);
                transition: opacity 0.2s ease-out;
            }
            #app-window-loading.is-hidden {
                opacity: 0;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <!-- 拖拽区域 -->
        <div id="application_window-drag-overlay" class="drag-overlay">
            <div class="absolute top-0 right-0 z-10 flex">
                <button
                    id="app-minimize-btn"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
                >
                    <i class="fas fa-minus"></i>
                </button>
                <button
                    id="app-maximize-btn"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
                >
                    <i class="far fa-square" id="app-maximize-icon"></i>
                </button>
                <button
                    id="app-close-btn"
                    class="window-control-btn w-10 h-8 text-xs text-gray-500 hover:bg-red-500 hover:text-white transition"
                >
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- 应用 iframe -->
        <iframe id="app-iframe"></iframe>

        <!-- 启动占位：与主窗口同一个组件，应用首屏挂载后由 APPLICATION_READY 撤掉 -->
        <content-loading-view id="app-window-loading" data-type="tb"></content-loading-view>

        <script type="module">
            import './components/loading.js';
            import { guiShortcutManager } from './components/shortcutManager.ts';
            import { registerDisplayZoomShortcuts } from './scripts/display-zoom-shortcuts.ts';
            import { createLocaleAppViewRefresher } from './scripts/application-locale-refresh.ts';
            import { createRendererTranslator, resolveRendererLocale } from './locale.ts';

            // 独立应用窗口与主窗口共用同一套界面缩放快捷键（Ctrl+{+,-,0}）：
            // 缩放偏好是全局设置，两边的缩放比例始终一致。
            registerDisplayZoomShortcuts();
            guiShortcutManager.attach();

            // 应用首屏就绪的兜底上限（与主窗口 / 桌面浮窗的启动占位一致）
            var APP_READY_TIMEOUT_MS = 15000;

            var currentTranslator = createRendererTranslator();
            var iframe = document.getElementById('app-iframe');
            var loadingEl = document.getElementById('app-window-loading');
            var readyTimer = null;
            var isExternalApp = false;
            // iframe 初始没有 src，浏览器会先给出一张 about:blank 并触发一次 load；
            // 只有真正指向应用页之后的那次 load 才能当成"外部应用首屏就绪"
            var frameSrcAssigned = false;

            // 应用 iframe 收不到主进程的 setting:changed / locale:packsChanged 广播
            // （子 frame 不在 webContents.send 的送达范围），无法原地跟随语言。
            // 生效语言变化或当前语言的语言包词条变化时，重挂 iframe 重新起界面：
            // 重开的应用会主动拉取最新设置与语言包快照，按新语言全新渲染。
            var appLocaleRefresher = createLocaleAppViewRefresher(function () {
                var currentSrc = iframe.getAttribute('src');
                if (currentSrc) {
                    iframe.src = currentSrc;
                }
            });

            function labelButton(buttonId, key) {
                var button = document.getElementById(buttonId);
                if (!button) return;
                var text = currentTranslator(key);
                button.title = text;
                button.setAttribute('aria-label', text);
            }

            // 最大化/还原图标与按钮文案
            function updateMaximizeIcon() {
                window.windowControlAPI.isMaximized().then(function (maximized) {
                    var icon = document.getElementById('app-maximize-icon');
                    if (icon) {
                        icon.className = maximized ? 'fas fa-window-restore' : 'far fa-square';
                    }
                    labelButton('app-maximize-btn', maximized ? 'common.restore' : 'common.maximize');
                });
            }

            function applyLocalization(setting) {
                currentTranslator = createRendererTranslator(setting);
                document.documentElement.lang = resolveRendererLocale(setting);
                // 文案变化后组件会自行重绘（见 components/loading.js 的 observedAttributes）
                if (loadingEl)
                    loadingEl.setAttribute('data-message', currentTranslator('renderer.application.loading'));
                labelButton('app-minimize-btn', 'common.minimize');
                labelButton('app-close-btn', 'common.close');
                updateMaximizeIcon();
            }

            // 撤掉启动占位：应用首屏已挂载（APPLICATION_READY）或外部应用 iframe 加载完成
            function finishLoading() {
                var el = loadingEl;
                if (!el) return;
                loadingEl = null;
                if (readyTimer !== null) {
                    clearTimeout(readyTimer);
                    readyTimer = null;
                }
                window.removeEventListener('message', onReadyMessage);
                iframe.removeEventListener('load', onFrameLoad);
                el.classList.add('is-hidden');
                setTimeout(function () {
                    el.remove();
                }, 300);
            }

            // 应用壳页面挂载完 entry widget 后会回传 APPLICATION_READY（见 scripts/application-host.ts）
            function onReadyMessage(event) {
                if (!event.data || event.data.type !== 'APPLICATION_READY') return;
                // 只认本窗口 iframe 发来的就绪信号
                if (event.source !== iframe.contentWindow) return;
                finishLoading();
            }

            function onFrameLoad() {
                // 外部应用不会回传就绪信号，按 iframe load 判定首屏
                if (!frameSrcAssigned || !isExternalApp) return;
                finishLoading();
            }

            // 占位兜底先注册：后续步骤（本地化、应用页加载）出问题时占位也不会永不消失
            window.addEventListener('message', onReadyMessage);
            iframe.addEventListener('load', onFrameLoad);
            readyTimer = setTimeout(finishLoading, APP_READY_TIMEOUT_MS);

            // 窗口控制按钮
            document.getElementById('app-close-btn').addEventListener('click', function () {
                window.windowControlAPI.close();
            });
            document.getElementById('app-minimize-btn').addEventListener('click', function () {
                window.windowControlAPI.minimize();
            });
            document.getElementById('app-maximize-btn').addEventListener('click', function () {
                window.windowControlAPI.maximize();
            });
            window.addEventListener('resize', updateMaximizeIcon);

            applyLocalization();
            // 记录生效语言 / 语言包快照（启动基线只记录，变化时才触发重挂）
            function recordLocaleState(setting) {
                appLocaleRefresher.recordLocale(setting && setting.resolved_locale);
            }
            window.settingAPI
                .loadSettingObject()
                .then(function (setting) {
                    applyLocalization(setting);
                    recordLocaleState(setting);
                })
                .catch(function () {});
            window.settingAPI.onSettingChanged?.(function (data) {
                applyLocalization(data);
                recordLocaleState(data);
            });
            // 语言包安装/卸载/更新后按最新设置重放一次本地化；
            // 当前语言的词条实际变化时重挂应用 iframe（语言未变的词条修正也能生效）
            window.localeAPI?.onLocalePacksChanged?.(function (snapshot) {
                appLocaleRefresher.recordPackSnapshot(snapshot);
                window.settingAPI
                    .loadSettingObject()
                    .then(function (setting) {
                        applyLocalization(setting);
                        recordLocaleState(setting);
                    })
                    .catch(function () {});
            });
            // 同 index.html：注册晚于 preload 首拉分发时会错过首播，
            // 立即用 preload 已缓存快照补建基线（null 时 recordPackSnapshot 不动基线）
            appLocaleRefresher.recordPackSnapshot(window.localeAPI?.getLocalePacks?.() ?? null);

            // 加载应用
            var params = new URLSearchParams(window.location.search);
            var bundleName = params.get('applicationBundleName');
            if (bundleName) {
                // 与主窗口 / 桌面浮窗的打开流程一致：先等该应用自身的延迟资源就绪再挂 iframe
                window.applicationRegistryAPI
                    .ensureApplicationLoaded(bundleName)
                    .catch(function () {})
                    .then(function () {
                        return window.applicationRegistryAPI.getApplicationGUIConfig(bundleName);
                    })
                    .then(function (config) {
                        isExternalApp = !!(config && config.source === 'user' && config.entryUrl);
                        iframe.src = isExternalApp
                            ? config.entryUrl
                            : './application.html?applicationBundleName=' + encodeURIComponent(bundleName);
                        frameSrcAssigned = true;
                        // 设置窗口标题
                        document.title = (config && config.name) || bundleName;
                    })
                    .catch(function () {
                        // 降级：尝试作为内置应用加载
                        iframe.src = './application.html?applicationBundleName=' + encodeURIComponent(bundleName);
                        frameSrcAssigned = true;
                    });
            } else {
                // 没有 bundleName 就不会加载应用页，占位没有意义
                finishLoading();
            }

            // 监听 iframe 内的主题变化并同步
            var observer = new MutationObserver(function () {
                var theme = document.documentElement.getAttribute('data-theme');
                if (theme) {
                    iframe.contentWindow &&
                        iframe.contentWindow.postMessage(
                            {
                                type: 'THEME',
                                theme: theme
                            },
                            '*'
                        );
                }
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        </script>
    </body>
</html>
