<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flipper Desk | 一站式办公生活空间</title>
        <script src="../renderer/styles/tailwind.css"></script>
        <script src="../assets/scripts/alpinejs.min.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

        <script src="../renderer/components/agentinput.js"></script>
        <script src="../renderer/components/taskview.js"></script>
        <script src="../renderer/components/loading.js"></script>

        <script src="../assets/scripts/wangEditor.min.js" defer></script>
        <link rel="stylesheet" href="../assets/styles/wangEditor.css" defer />

        <!-- Markdown 渲染相关样式 -->
        <link rel="stylesheet" href="../renderer/styles/highlight-vs.min.css">
        <link rel="stylesheet" href="../renderer/styles/github-markdown-light.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
        
        <!-- Markdown 渲染库 -->
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
        
        <style>
            /* 优化 markdown 在对话框中的显示 */
            .markdown-body {
                font-size: 14px;
            }
            .markdown-body h1, .markdown-body h2, .markdown-body h3 {
                margin-top: 1em;
                margin-bottom: 0.5em;
            }
            .markdown-body p {
                margin-bottom: 0.8em;
            }
            .markdown-body code {
                background-color: rgba(0, 0, 0, 0.05);
                padding: 0.2em 0.4em;
                border-radius: 3px;
                font-size: 0.9em;
            }
            .markdown-body pre {
                background-color: rgba(0, 0, 0, 0.05);
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin: 1em 0;
            }
            .markdown-body pre code {
                background-color: transparent;
                padding: 0;
            }
            .markdown-body ul, .markdown-body ol {
                margin: 0.8em 0;
                padding-left: 1.5em;
            }
            .markdown-body li {
                margin: 0.3em 0;
            }
            .markdown-body blockquote {
                border-left: 4px solid #ddd;
                padding-left: 1em;
                margin: 1em 0;
                color: #666;
            }
            .markdown-body table {
                border-collapse: collapse;
                margin: 1em 0;
                width: 100%;
            }
            .markdown-body table th,
            .markdown-body table td {
                border: 1px solid #ddd;
                padding: 0.5em;
            }
            .markdown-body table th {
                background-color: #f5f5f5;
                font-weight: bold;
            }
        </style>

        <style>
            html, body {
                height: 100%; /* 关键：让html继承窗口高度 */
                margin: 0;    /* 移除默认外边距，防止出现滚动条 */
                padding: 0;
                overflow: hidden; /* 可选：如果你不希望内部出现滚动条 */
            }
            [x-cloak] {
                display: none !important;
            }
        </style>
    </head>
    <body x-data="{ showFloatingChatPanel: false, isMaximized: false }">
        <div id="application-container" class="w-full h-full">

        </div>

        <div
            id="floating-ai-chat-panel"
            x-ref="chatPanel"
            x-cloak
            :class="isMaximized ? 'max-w-full h-full pt-20 transition-all duration-500 ease-in-out' : 'max-w-2xl h-96 transition-all duration-500 ease-in-out'"
            class="fixed bottom-0 left-1/2 z-50 -translate-x-1/2 w-full px-4 mb-3 pointer-events-none flex flex-col items-center"
            x-show="showFloatingChatPanel"
            @click.outside="
            if (!$refs.chatPanel.contains($event.target) && !$refs.agentInput.contains($event.target)) {
                showFloatingChatPanel = false
            }
            "
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="translate-y-full"
            x-transition:enter-end="translate-y-0"
            x-transition:leave="transition ease-in duration-300 transform"
            x-transition:leave-start="translate-y-0"
            x-transition:leave-end="translate-y-full"
        >
            <div id="floating-ai-task-view-container"
                class="w-full h-full bg-white/60 backdrop-blur-md shadow-xl rounded-3xl border border-gray-200 pb-14 pt-1 flex flex-col overflow-hidden pointer-events-auto"
            >
            </div>
        </div>

        <div
            class="fixed bottom-3 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 z-50 pointer-events-none"
            x-ref="agentInput"
        >
            <application-agent-input id="application-agent-input" style="pointer-events:auto"/>
        </div>

        <script type="module">
            var currentTaskId = null;
            var currentToolset = null;

            async function submitRequest(request) {
                const floatingChatPanel = document.querySelector('#floating-ai-chat-panel');
                const applicationEntryWidget = document.querySelector('#application-entry-widget');

                if (currentTaskId === null) {
                    currentTaskId = await window.taskManagerAPI.createTask();
                    const taskViewContainer = document.querySelector('#floating-ai-task-view-container');
                    taskViewContainer.innerHTML = `
                    <header class="w-full px-2.5 py-1.5 text-xs flex justify-left items-center text-center">
                        <button id='floating-ai-chat-panel-maximize-button' class="group flex items-center px-2 py-1 rounded-full
                            bg-transparent hover:bg-white/60 hover:shadow-md
                            transition-all duration-500 ease-[cubic-bezier(0.23,1,0.32,1)]
                            text-gray-700 hover:text-blue-600"
                            @click="isMaximized = !isMaximized"
                        >
                            <i class="fa-solid fa-maximize"></i>
                            <span class="max-w-0 overflow-hidden opacity-0
                                group-hover:max-w-[120px] group-hover:opacity-100
                                group-hover:ml-2 transition-all duration-500 ease-in-out
                                whitespace-nowrap font-medium tracking-tight"
                                x-text="isMaximized ? '还原' : '最大化'"
                            >
                            </span>
                        </button>
                    </header>
                    <embedded-task-view id='task-view-${currentTaskId}' task_id="${currentTaskId}" class="flex-1 overflow-y-auto" />
                    `;
                }

                currentToolset = applicationEntryWidget.getToolset();
                if (currentToolset) {
                    console.info('attaching toolset', currentToolset.toJSON());
                    await window.taskManagerAPI.attachToolset(
                        currentTaskId, currentToolset.toJSON(),
                        currentToolset.callTool.bind(currentToolset)
                    );
                    console.info('attached toolset finished');
                }
                const agentInstruct = applicationEntryWidget.getAgentInstruct();
                if (agentInstruct) {
                    await window.taskManagerAPI.setSystemPrompt(currentTaskId, agentInstruct);
                }
                window.taskManagerAPI.submitMessage(currentTaskId, request);
                document.querySelector(`#task-view-${currentTaskId}`).reload();
                Alpine.$data(document.body).showFloatingChatPanel = true;
            }

            (async () => {
                const applicationBundleName = new URLSearchParams(window.location.search).get('applicationBundleName');
                const guiConfig = await window.applicationAPI.getApplicationGUIConfig(applicationBundleName);
                for (const javascript of guiConfig.javascripts) {
                    const script = document.createElement('script');
                    script.src = javascript;
                    script.type = 'module';
                    document.body.appendChild(script);
                }
                document.querySelector('#application-container').innerHTML = `<${guiConfig.entry} id='application-entry-widget' class="w-full h-full"/>`
                document.querySelector('#application-agent-input').addEventListener('focus', () => {
                    // 如果用户激活了聊天输入浮窗，且当前有任务，则显示浮动聊天面板
                    if (currentTaskId !== null) {
                        Alpine.$data(document.body).showFloatingChatPanel = true;
                    }
                });
                document.querySelector('#application-agent-input').addEventListener('submit', (e) => {
                    submitRequest(e.detail);
                });
            })()
        </script>
    </body>
</html>
