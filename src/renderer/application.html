<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flipper Desk | 一站式办公生活空间</title>
        <script src="../renderer/styles/tailwind.css"></script>
        <script src="../renderer/scripts/alpinejs.min.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

        <script src="../renderer/components/agentinput.js"></script>
        <script src="../renderer/components/taskview.js"></script>

        <style>
            html, body {
                height: 100%; /* 关键：让html继承窗口高度 */
                margin: 0;    /* 移除默认外边距，防止出现滚动条 */
                padding: 0;
                overflow: hidden; /* 可选：如果你不希望内部出现滚动条 */
            }
        </style>
    </head>
    <body x-data="{ showFloatingChatPanel: false }">
        <div id="application-container" class="w-full h-full">

        </div>

        <div
            id="floating-ai-chat-panel"
            x-ref="chatPanel"
            class="fixed bottom-0 left-1/2 z-50 -translate-x-1/2 w-full h-80 max-w-xl px-4 mb-3 pointer-events-none flex flex-col items-center"
            x-show="showFloatingChatPanel"
            @click.outside="
            if (!$refs.chatPanel.contains($event.target) && !$refs.agentInput.contains($event.target)) {
                showFloatingChatPanel = false
            }
            "
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="translate-y-full"
            x-transition:enter-end="translate-y-0"
            x-transition:leave="transition ease-in duration-300 transform"
            x-transition:leave-start="translate-y-0"
            x-transition:leave-end="translate-y-full"
        >
            <div id="floating-ai-task-view-container"
                class="w-full h-full bg-white/60 backdrop-blur-md shadow-xl rounded-3xl border border-gray-200 pb-14 flex flex-col overflow-hidden pointer-events-auto"
                style="max-height: 80vh;"
            >
            </div>
        </div>

        <div
            class="fixed bottom-3 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 z-50 pointer-events-none"
            x-ref="agentInput"
        >
            <application-agent-input id="application-agent-input" style="pointer-events:auto"/>
        </div>

        <script>
            var currentTaskId = null;

            async function submitRequest(detail) {
                const floatingChatPanel = document.querySelector('#floating-ai-chat-panel');
                if (currentTaskId === null) {
                    currentTaskId = await window.taskManagerAPI.createTask();
                    const taskViewContainer = document.querySelector('#floating-ai-task-view-container');
                    taskViewContainer.innerHTML = `
                    <embedded-task-view id='task-view-${currentTaskId}' task_id="${currentTaskId}" style="width: 100%; height: 100%;"/>
                    `
                }

                window.taskManagerAPI.submitMessage(currentTaskId, detail);
                document.querySelector(`#task-view-${currentTaskId}`).reload();
                Alpine.$data(document.body).showFloatingChatPanel = true;
            }

            (async () => {
                const applicationBundleName = new URLSearchParams(window.location.search).get('applicationBundleName');
                const guiConfig = await window.applicationAPI.getApplicationGUIConfig(applicationBundleName);
                for (const javascript of guiConfig.javascripts) {
                    const script = document.createElement('script');
                    script.src = javascript;
                    document.body.appendChild(script);
                }
                document.querySelector('#application-container').innerHTML = `
                <${guiConfig.entry} class="w-full h-full"/>
                `
                document.querySelector('#application-agent-input').addEventListener('focus', () => {
                    if (currentTaskId !== null) {
                        Alpine.$data(document.body).showFloatingChatPanel = true;
                    }
                });
                document.querySelector('#application-agent-input').addEventListener('submit', (e) => {
                    submitRequest(e.detail);
                });
            })()
        </script>
    </body>
</html>
