[package]
name = "dynobox-linux"
version = "0.1.0"
edition = "2021"
description = "Linux dynamic file-access sandbox (FUSE mirror + policy engine), counterpart of the Windows dynobox."
license = "MulanPSL-2.0"

[dependencies]
# default-features = false + 不启用 libfuse：fuser 以 pure-rust 后端编译（我们只用
# Session::from_fd + mount(2)，不需要其 mount 辅助）。保留 libfuse 会经 pkg-config
# 链接系统 libfuse3：构建机无 fuse 开发包时 build.rs 会 panic 失败，且产物带
# libfuse3.so.3 运行期依赖（与"零运行时依赖、装完即可跑"的设计相悖）。
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "fs", "uio"] }

[profile.release]
lto = true
strip = true

[patch.crates-io]
fuser = { path = "vendor/fuser" }
