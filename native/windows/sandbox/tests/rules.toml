# ============================================================
# dynobox 访问控制规则（示例：配套 examples/src 测试夹具）
# ============================================================
# 命中多条规则时取**最具体**的模式（剥离尾部 `/**` 后的前缀最长），同长按
# deny > ask > allow —— 规则书写顺序不影响判定，defense 不依赖把 deny 放前面。
# path   : 沙箱内虚拟路径（/ 开头）。`**` 跨层级，`*` 单层级，`?` 单字符；
#          尾部 `/**` 只覆盖子树、**不含目录自身**（`/dir/**` 不命中 `/dir`，
#          要连目录本身一起约束须再写一条 `path = "/dir"`）。
# access : read | write | execute | all
#          read    = 读内容/列目录/读属性
#          write   = 写内容/创建/删除/改名/改属性
#          execute = 以可执行方式打开（拉起进程、加载 DLL）
# perm   : allow（放行） | ask（问上游 HTTP 端点） | deny（拒绝）

version = 1
default = "deny"                     # 没有任何规则命中时的兜底

# 单根声明：把单个目录映射为卷根 / —— 由命令行 `--src <DIR>` 提供（例如
# `--src examples/src`，配合下面的 /tests/**、/docs/** 等相对路径规则）。
# 策略文件里的 `[[roots]]` 已不再支持（core 会 fail-loud 拒绝该表）；
# 多盘请改用 `--automount` 并参考同目录的 rules_drive.toml。

[ask]
endpoint = "http://127.0.0.1:8080/decide"   # 可被命令行 --upstream 覆盖
timeout_ms = 2000                    # 超时/不可达 => 按 deny（fail-closed）
cache_ttl_seconds = 60               # ask 决策缓存时长，0 = 不缓存

# ------------------------------------------------------------
# 根目录：允许浏览
# ------------------------------------------------------------
[[rules]]
path = "/"
access = "read"
perm = "allow"

# ------------------------------------------------------------
# /tests 测试脚本：只读
# ------------------------------------------------------------
[[rules]]
path = "/tests/**"
access = "read"
perm = "allow"

# ------------------------------------------------------------
# /tests2 高级场景测试脚本：只读
# ------------------------------------------------------------
[[rules]]
path = "/tests2/**"
access = "read"
perm = "allow"

# ------------------------------------------------------------
# /docs：可读，但 secret.txt 静态拒绝
# （注意：首条命中的规则生效，因此更具体的规则必须放在前面）
# ------------------------------------------------------------
[[rules]]
path = "/docs/secret.txt"
access = "all"
perm = "deny"

[[rules]]
path = "/docs/**"
access = "read"
perm = "allow"

# ------------------------------------------------------------
# /public：完全放行（读写都不要问）
# ------------------------------------------------------------
[[rules]]
path = "/public/**"
access = "all"
perm = "allow"

# ------------------------------------------------------------
# /notes：读要经过上游端点审批
# ------------------------------------------------------------
[[rules]]
path = "/notes/**"
access = "read"
perm = "ask"

# ------------------------------------------------------------
# /staging：读放行，写要审批
# ------------------------------------------------------------
[[rules]]
path = "/staging/**"
access = "read"
perm = "allow"

[[rules]]
path = "/staging/**"
access = "write"
perm = "ask"

# ------------------------------------------------------------
# /slow：写要审批 —— 端点对此路径故意挂起 8 秒，
#        用于验证沙箱超时后 fail-closed 拒绝
# ------------------------------------------------------------
[[rules]]
path = "/slow/**"
access = "all"
perm = "ask"

# ------------------------------------------------------------
# /scratch：全部操作交给端点审批 —— 端点允许时会下发
# "/scratch/**" 的子树授权（协议 v2），后续同树操作零问询
# ------------------------------------------------------------
[[rules]]
path = "/scratch/**"
access = "all"
perm = "ask"

# ------------------------------------------------------------
# /reject：ask 被端点恒拒（演示 ask 拒绝路径，端点不下发授权）
# ------------------------------------------------------------
[[rules]]
path = "/reject/**"
access = "all"
perm = "ask"

# ------------------------------------------------------------
# /guarded：ask 端点允许但不下发授权（每次新路径重新问询）
# ------------------------------------------------------------
[[rules]]
path = "/guarded/**"
access = "all"
perm = "ask"

# ------------------------------------------------------------
# /vault：完全拒绝
# ------------------------------------------------------------
[[rules]]
path = "/vault/**"
access = "all"
perm = "deny"

# ------------------------------------------------------------
# /tools：执行控制。更具体的在前：
#   blocked 子树拒绝执行；ask 子树要审批；其余放行
# ------------------------------------------------------------
[[rules]]
path = "/tools/blocked/**"
access = "execute"
perm = "deny"

[[rules]]
path = "/tools/ask/**"
access = "execute"
perm = "ask"

[[rules]]
path = "/tools/**"
access = "all"
perm = "allow"
