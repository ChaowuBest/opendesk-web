<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OpenDesk · IM 设计探索</title>
        <style>
            @font-face {
                font-family: 'HarmonyOS Sans';
                src: url('../../resources/renderer/fonts/harmonyos/HarmonyOS_Sans_SC_Regular.woff2') format('woff2');
                font-display: swap;
            }
            :root {
                color-scheme: light;
                --page: #eeedeb;
                --surface: #ffffff;
                --sidebar: #f5f5f5;
                --muted-surface: #fafafa;
                --ink: #1c1917;
                --ink2: #4a4642;
                --ink3: #79736d;
                --line: #e7e5e2;
                --line-soft: #f0efec;
                --accent: #df4436;
                --accent-ink: #bb352a;
                --accent-soft: #fdeeec;
                --green: #238257;
                --green-soft: #e7f5ee;
                --blue: #4267b2;
                --blue-soft: #ebf1fb;
                --amber: #996718;
                --amber-soft: #fdf3e3;
                --bubble: #f4f3f1;
                --shadow: 0 12px 40px #24201b0a, 0 2px 6px #24201b04;
                --font: 'HarmonyOS Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            }
            html[data-theme='dark'] {
                color-scheme: dark;
                --page: #191817;
                --surface: #252526;
                --sidebar: #1e1e1e;
                --muted-surface: #22201e;
                --ink: #efedea;
                --ink2: #d5d1cb;
                --ink3: #aaa49e;
                --line: #3b3835;
                --line-soft: #33302d;
                --accent: #e8563f;
                --accent-ink: #ff9a89;
                --accent-soft: #422c29;
                --green: #67c99b;
                --green-soft: #233b30;
                --blue: #96b5ec;
                --blue-soft: #2b3545;
                --amber: #dbb068;
                --amber-soft: #403526;
                --bubble: #33302d;
                --shadow: 0 12px 40px #00000024;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--page);
                color: var(--ink);
                font: 13px/1.5 var(--font);
                -webkit-font-smoothing: antialiased;
            }
            button,
            input,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                border: 0;
                cursor: pointer;
                background: transparent;
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            button,
            input,
            textarea {
                -webkit-tap-highlight-color: transparent;
            }
            button:focus-visible,
            input:focus-visible,
            textarea:focus-visible,
            summary:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
            }
            input,
            textarea {
                min-width: 0;
            }
            input::placeholder,
            textarea::placeholder {
                color: var(--ink3);
            }
            h1,
            h2,
            h3,
            p {
                margin: 0;
            }
            svg {
                display: block;
                flex: none;
            }
            .icon {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.6;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .between {
                justify-content: space-between;
            }
            .muted {
                color: var(--ink3);
            }
            .small {
                font-size: 11px;
            }
            .grow {
                flex: 1;
                min-width: 0;
            }
            .truncate {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 30px;
                height: 30px;
                border-radius: 7px;
                color: var(--ink3);
                flex: none;
            }
            .icon-btn:hover {
                background: var(--bubble);
                color: var(--ink);
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 5px;
                color: var(--ink3);
                background: var(--bubble);
                white-space: nowrap;
            }
            .pill.accent {
                color: var(--accent-ink);
                background: var(--accent-soft);
            }
            .primary {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                background: var(--accent);
                color: #fff;
                border-radius: 8px;
                padding: 8px 14px;
            }
            .primary:hover {
                filter: brightness(0.94);
            }
            .secondary {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                padding: 7px 12px;
                border: 1px solid var(--line);
                border-radius: 7px;
                background: var(--surface);
            }
            .secondary:hover {
                background: var(--bubble);
            }
            .logo {
                width: 29px;
                height: 29px;
                border-radius: 9px;
                background: var(--accent);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                flex: none;
            }
            .logo::before,
            .logo::after {
                content: '';
                width: 5px;
                height: 14px;
                background: #fff;
                border-radius: 3px;
                transform: skewY(-14deg);
            }
            .studio {
                max-width: 1800px;
                margin: auto;
                padding: 0 30px 18px;
            }
            .studio-header {
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }
            .studio-header h1 {
                font-size: 15px;
                font-weight: 600;
            }
            .studio-header .eyebrow {
                color: var(--ink3);
                font-size: 10px;
                letter-spacing: 1.4px;
                margin-bottom: 3px;
            }
            .studio-controls {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .prototype-status {
                margin-right: 10px;
                color: var(--ink3);
                font-size: 11px;
            }
            .prototype-status::before {
                content: '';
                display: inline-block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--accent);
                vertical-align: middle;
                margin-right: 6px;
            }
            .variant-picker {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 9px;
                margin: 1px 0 17px;
            }
            .variant {
                display: flex;
                align-items: center;
                gap: 13px;
                padding: 12px 16px;
                min-height: 67px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--muted-surface);
                text-align: left;
            }
            .variant:hover {
                background: var(--surface);
            }
            .variant[aria-pressed='true'] {
                border-color: var(--accent);
                background: var(--surface);
                box-shadow: 0 0 0 1px var(--accent);
            }
            .variant-index {
                font-size: 18px;
                font-weight: 500;
                color: var(--ink3);
                font-variant-numeric: tabular-nums;
            }
            .variant[aria-pressed='true'] .variant-index {
                color: var(--accent);
            }
            .variant-name {
                display: block;
                font-size: 13px;
                font-weight: 600;
            }
            .variant-caption {
                display: block;
                font-size: 10px;
                color: var(--ink3);
                margin-top: 3px;
            }
            .app-window {
                position: relative;
                height: max(650px, calc(100dvh - 246px));
                max-height: 1000px;
                display: grid;
                grid-template: 35px minmax(0, 1fr) / 166px 252px minmax(0, 1fr);
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .titlebar {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 15px;
                border-bottom: 1px solid var(--line-soft);
                background: var(--surface);
                color: var(--ink3);
                font-size: 10px;
                user-select: none;
            }
            .window-controls {
                display: flex;
                gap: 21px;
                align-items: center;
            }
            .window-controls .icon {
                width: 11px;
                height: 11px;
            }
            .app-nav {
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding: 22px 13px 14px;
                background: var(--sidebar);
                border-right: 1px solid var(--line);
            }
            .app-brand {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 0 5px 27px;
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.5px;
            }
            .app-brand .logo {
                width: 25px;
                height: 25px;
                border-radius: 7px;
            }
            .app-brand .logo::before,
            .app-brand .logo::after {
                height: 12px;
                width: 4px;
            }
            .nav-item {
                display: flex;
                align-items: center;
                gap: 10px;
                min-height: 36px;
                padding: 0 10px;
                margin-bottom: 5px;
                border-radius: 7px;
                color: var(--ink2);
                white-space: nowrap;
            }
            .nav-item.current {
                color: var(--accent-ink);
                background: var(--accent-soft);
                font-weight: 600;
            }
            .nav-item .count {
                font-size: 10px;
                margin-left: auto;
            }
            .nav-label {
                font-size: 10px;
                color: var(--ink3);
                margin: 26px 10px 12px;
                letter-spacing: 0.4px;
            }
            .workspace-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 10px;
                color: var(--ink2);
                font-size: 11px;
            }
            .workspace-dot {
                width: 6px;
                height: 6px;
                border: 1px solid var(--ink3);
                border-radius: 2px;
            }
            .app-nav footer {
                margin-top: auto;
            }
            .account {
                border-top: 1px solid var(--line);
                padding: 15px 4px 0;
                margin-top: 14px;
            }
            .account .avatar {
                width: 29px;
                height: 29px;
                font-size: 10px;
                border-radius: 9px;
            }
            .account-name {
                font-size: 11px;
            }
            .account-role {
                font-size: 9px;
                color: var(--ink3);
            }
            .conversation-panel {
                background: var(--muted-surface);
                border-right: 1px solid var(--line);
                padding: 24px 12px 12px;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .conversation-heading {
                padding: 0 7px;
                margin-bottom: 17px;
            }
            .conversation-heading h2 {
                font-size: 19px;
                letter-spacing: -0.5px;
                font-weight: 600;
            }
            .search-field {
                display: flex;
                align-items: center;
                gap: 7px;
                background: var(--bubble);
                border: 1px solid transparent;
                border-radius: 7px;
                padding: 7px 9px;
                color: var(--ink3);
            }
            .search-field:focus-within {
                border-color: var(--accent);
            }
            .search-field .icon {
                width: 14px;
                height: 14px;
            }
            .search-field input {
                outline: none;
                border: 0;
                background: transparent;
                width: 100%;
                font-size: 11px;
            }
            .search-field kbd {
                font-size: 9px;
                border: 1px solid var(--line);
                border-radius: 3px;
                padding: 0 3px;
            }
            .filter-tabs {
                display: flex;
                gap: 4px;
                margin: 15px 0 16px;
            }
            .filter-tab {
                flex: 1;
                padding: 5px;
                border-radius: 5px;
                font-size: 11px;
                color: var(--ink3);
                white-space: nowrap;
            }
            .filter-tab[aria-pressed='true'] {
                background: var(--surface);
                color: var(--ink);
                box-shadow: 0 1px 4px #00000008;
            }
            .list-label {
                color: var(--ink3);
                font-size: 10px;
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 0 8px;
                margin: 5px 0 9px;
            }
            .list-label .icon {
                width: 11px;
                height: 11px;
            }
            .conversation-list {
                flex: 1;
                overflow: auto;
                scrollbar-width: thin;
                min-height: 0;
            }
            .conversation {
                display: flex;
                width: 100%;
                align-items: center;
                gap: 10px;
                padding: 12px 9px;
                border-radius: 8px;
                text-align: left;
                margin-bottom: 3px;
                min-width: 0;
            }
            .conversation:hover {
                background: var(--bubble);
            }
            .conversation[aria-current='true'] {
                background: var(--accent-soft);
            }
            .conversation-name {
                font-size: 12px;
                font-weight: 500;
            }
            .conversation-time {
                font-size: 9px;
                color: var(--ink3);
                white-space: nowrap;
            }
            .conversation-preview {
                margin-top: 5px;
                font-size: 10px;
                color: var(--ink3);
            }
            .unread {
                display: inline-grid;
                place-items: center;
                background: var(--accent);
                color: #fff;
                font-size: 9px;
                min-width: 16px;
                height: 16px;
                border-radius: 5px;
            }
            .avatar {
                width: 35px;
                height: 35px;
                border-radius: 11px;
                background: var(--blue-soft);
                color: var(--blue);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                position: relative;
                flex: none;
                font-size: 12px;
                font-weight: 500;
            }
            .avatar.sage {
                background: var(--green-soft);
                color: var(--green);
            }
            .avatar.sand {
                background: var(--amber-soft);
                color: var(--amber);
            }
            .avatar.rose {
                background: var(--accent-soft);
                color: var(--accent-ink);
            }
            .avatar.neutral {
                background: var(--bubble);
                color: var(--ink2);
            }
            .avatar.online::after {
                content: '';
                position: absolute;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--green);
                border: 2px solid var(--surface);
                right: -1px;
                bottom: -1px;
                box-sizing: content-box;
            }
            .avatar.group {
                background: var(--bubble);
                display: inline-grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                padding: 4px;
                border: 1px solid var(--line);
            }
            .avatar.group b {
                height: 12px;
                font-size: 7px;
                border-radius: 3px;
                text-align: center;
                line-height: 12px;
                font-weight: 400;
            }
            .avatar.group b:nth-child(1) {
                background: var(--blue-soft);
                color: var(--blue);
            }
            .avatar.group b:nth-child(2) {
                background: var(--green-soft);
                color: var(--green);
            }
            .avatar.group b:nth-child(3) {
                background: var(--amber-soft);
                color: var(--amber);
            }
            .avatar.group b:nth-child(4) {
                background: var(--accent-soft);
                color: var(--accent-ink);
            }
            .conversation-footer {
                border-top: 1px solid var(--line-soft);
                padding: 12px 7px 0;
                color: var(--ink3);
                font-size: 10px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .conversation-footer .icon {
                width: 12px;
                height: 12px;
            }
            .chat-panel {
                min-width: 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                background: var(--surface);
                position: relative;
            }
            .chat-header {
                min-height: 79px;
                padding: 16px 25px 13px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .chat-header h2 {
                font-size: 15px;
                font-weight: 600;
            }
            .chat-subtitle {
                font-size: 10px;
                color: var(--ink3);
                margin-top: 4px;
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .status-dot {
                width: 5px;
                height: 5px;
                background: var(--green);
                border-radius: 50%;
                display: inline-block;
            }
            .chat-header-actions {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .avatar-stack {
                display: flex;
                padding-right: 7px;
            }
            .avatar-stack .avatar {
                width: 24px;
                height: 24px;
                border: 2px solid var(--surface);
                border-radius: 8px;
                margin-left: -5px;
                font-size: 8px;
            }
            .chat-tabs {
                display: flex;
                gap: 25px;
                border-bottom: 1px solid var(--line);
                padding: 0 25px;
                min-height: 34px;
            }
            .chat-tab {
                padding: 0 0 10px;
                font-size: 11px;
                color: var(--ink3);
                position: relative;
            }
            .chat-tab.active {
                color: var(--ink);
            }
            .chat-tab.active::after {
                content: '';
                height: 2px;
                background: var(--accent);
                position: absolute;
                bottom: -1px;
                left: 0;
                right: 0;
            }
            .chat-tab span {
                font-size: 9px;
                margin-left: 3px;
                color: var(--ink3);
            }
            .pinned-note {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 12px 25px 0;
                padding: 9px 11px;
                border-radius: 6px;
                background: var(--muted-surface);
                border: 1px solid var(--line-soft);
                color: var(--ink2);
                font-size: 10px;
            }
            .pinned-note .icon {
                width: 13px;
                height: 13px;
                color: var(--accent);
            }
            .pinned-note .note-label {
                color: var(--ink3);
                flex: none;
            }
            .message-list {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 16px 26px 7px;
                scrollbar-width: thin;
            }
            .date-divider {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 13px;
                color: var(--ink3);
                font-size: 9px;
                margin: 1px 0 23px;
            }
            .date-divider::before,
            .date-divider::after {
                content: '';
                width: 37px;
                height: 1px;
                background: var(--line);
            }
            .message {
                display: flex;
                gap: 10px;
                margin-bottom: 19px;
                align-items: flex-start;
            }
            .message > .avatar {
                width: 30px;
                height: 30px;
                border-radius: 9px;
                font-size: 10px;
            }
            .message-content {
                max-width: 82%;
                min-width: 0;
            }
            .message-meta {
                font-size: 10px;
                color: var(--ink2);
                margin: -1px 0 6px;
                display: flex;
                gap: 9px;
                align-items: center;
            }
            .message-meta time {
                font-size: 9px;
                color: var(--ink3);
            }
            .message-bubble {
                padding: 10px 13px;
                background: var(--bubble);
                border-radius: 0 10px 10px;
                color: var(--ink2);
                line-height: 1.8;
                font-size: 12px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .message.self {
                flex-direction: row-reverse;
            }
            .message.self .message-meta {
                justify-content: flex-end;
            }
            .message.self .message-bubble {
                background: var(--accent-soft);
                border-radius: 10px 0 10px 10px;
            }
            .read-status {
                text-align: right;
                color: var(--ink3);
                margin-top: 5px;
                font-size: 9px;
            }
            .file-card {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface);
                margin-top: 9px;
                min-width: 240px;
                max-width: 100%;
                text-align: left;
            }
            .file-symbol {
                width: 35px;
                height: 41px;
                border-radius: 5px;
                background: var(--accent-soft);
                color: var(--accent-ink);
                font-size: 9px;
                display: grid;
                place-items: center;
                letter-spacing: 0.3px;
                flex: none;
            }
            .file-name {
                font-size: 11px;
            }
            .file-meta {
                font-size: 9px;
                color: var(--ink3);
                margin-top: 4px;
            }
            .reactions {
                display: flex;
                gap: 5px;
                margin-top: 7px;
            }
            .reaction {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border: 1px solid var(--line);
                border-radius: 5px;
                padding: 2px 6px;
                font-size: 10px;
                color: var(--ink3);
            }
            .reaction[aria-pressed='true'] {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent-ink);
            }
            .thread-link {
                display: flex;
                align-items: center;
                gap: 5px;
                color: var(--blue);
                font-size: 10px;
                margin-top: 7px;
                padding: 0;
            }
            .thread-link .icon {
                width: 12px;
                height: 12px;
            }
            .composer-wrap {
                padding: 10px 25px 17px;
            }
            .composer {
                border: 1px solid var(--line);
                border-radius: 11px;
                background: var(--surface);
                box-shadow: 0 2px 6px #00000003;
                padding: 12px 13px 9px;
            }
            .composer:focus-within {
                border-color: var(--ink3);
            }

                const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

                    id: `local-${item.messages.length}`,

                    file,
                    time: now,
                    local: true

                    .map(
                        (id) =>
                            `<button class="member-option" style="width:100%" data-member="${id}">${avatar(id)}${t(id)}${mode === 'invite' && item.members.includes(id) ? `<span class="pill" style="margin-left:auto">${t('members')}</span>` : ''}</button>`
                    )
                    .join('');
                openDialog('mention-dialog');
            }
            root.addEventListener('click', (event) => {
                const button = event.target.closest('button');
                if (!button) return;
                if (button.dataset.variant || button.dataset.selectVariant) {
                    state.variant = Number(button.dataset.variant ?? button.dataset.selectVariant);
                    state.mobileList = false;
                    state.detailOpen = false;
                    state.detailHidden = false;
                    state.filter = 'all';
                    state.query = '';
                    render();
                    return;
                }
                if (button.dataset.conversation) {
                    selectConversation(button.dataset.conversation);
                    return;
                }
                if (button.dataset.filter) {
                    state.filter = button.dataset.filter;
                    root.querySelectorAll('[data-filter]').forEach((node) =>
                        node.setAttribute('aria-pressed', String(node.dataset.filter === state.filter))
                    );
                    renderConversations();
                    return;
                }
                if (button.dataset.chatTab) {
                    state.tab = button.dataset.chatTab;
                    render();
                    return;
                }
                if (button.dataset.close) {
                    closeDialog(button.dataset.close);
                    return;
                }
                if (button.dataset.reaction) {
                    const key = `${state.current}:${button.dataset.reaction}`;
                    if (state.reactions.has(key)) state.reactions.delete(key);
                    else state.reactions.add(key);
                    button.setAttribute('aria-pressed', String(state.reactions.has(key)));
                    button.querySelector('span').textContent = state.reactions.has(key) ? '4' : '3';
                    return;
                }
                if (button.dataset.member) {
                    const id = button.dataset.member;
                    closeDialog('mention-dialog');
                    if (state.memberMode === 'invite') {
                        const item = activeConversation();
                        if (item.members.includes(id)) {
                            toast('memberExists');
                            return;
                        }
                        item.members.push(id);
                        item.count += 1;
                        item.created = true;
                        render();
                        toast('memberAdded', { name: t(id) });
                    } else insertText(`@${t(id)} `);
                    return;
                }
                const action = button.dataset.action;
                if (action === 'file-preview') {
                    openDialog('file-dialog');
                    return;
                }
                if (action === 'thread') {
                    showDetails('thread');
                    return;
                }
                if (action === 'reply') {
                    insertText(t('replyPrefix'));
                    return;
                }
                if (action === 'invite') {
                    memberPicker('invite');
                    return;
                }
                if (action === 'clear-search') {
                    state.messageQuery = '';
                    renderMessages();
                    return;
                }
                if (action === 'remove-attachment') {
                    state.attachments[state.current] = false;
                    renderAttachment();
                    return;
                }
                const id = button.id;
                if (id === 'theme-toggle') {
                    document.documentElement.dataset.theme =
                        document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
                    button.innerHTML = icon(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun');
                } else if (id === 'locale-toggle') {
                    state.locale = state.locale === 'zh-CN' ? 'en' : 'zh-CN';
                    render();
                } else if (id === 'compare-button') openDialog('comparison-dialog');
                else if (id === 'new-conversation') openDialog('group-dialog');
                else if (id === 'mobile-back') {
                    state.mobileList = true;
                    state.detailOpen = false;
                    render();
                } else if (id === 'search-messages') openDialog('search-dialog');
                else if (id === 'toggle-details') {
                    if (root.querySelector('.context-panel').getClientRects().length) hideDetails();
                    else showDetails();
                } else if (id === 'close-details') {
                    hideDetails();
                } else if (id.startsWith('close-')) {
                    const dialog = button.closest('dialog');
                    if (dialog) dialog.close();
                } else if (id === 'insert-emoji') insertText('👍 ');
                else if (id === 'attach-file') {
                    state.attachments[state.current] = true;
                    renderAttachment();
                    toast('attached');
                } else if (id === 'mention-member') memberPicker('mention');
                else if (id === 'polish-message') {
                    if (!(state.drafts[state.current] ?? '').trim()) {
                        toast('aiHint');
                        return;
                    }
                    state.drafts[state.current] = t('polishedCopy');
                    document.getElementById('message-input').value = state.drafts[state.current];
                    renderAttachment();
                    toast('polished');
                }
            });
            root.addEventListener('input', (event) => {
                if (event.target.id === 'conversation-search') {
                    state.query = event.target.value;
                    renderConversations();
                }
                if (event.target.id === 'message-input') {
                    state.drafts[state.current] = event.target.value;
                    renderAttachment();
                }
            });
            root.addEventListener('keydown', (event) => {
                if (
                    event.target.id === 'message-input' &&
                    event.key === 'Enter' &&
                    !event.shiftKey &&
                    !event.isComposing &&
                    event.keyCode !== 229
                ) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            document.addEventListener('keydown', (event) => {
                if (
                    event.key === '/' &&
                    !['INPUT', 'TEXTAREA'].includes(event.target.tagName) &&
                    !document.querySelector('dialog[open]')
                ) {
                    const input = document.getElementById('conversation-search');
                    if (input.getClientRects().length) {
                        event.preventDefault();
                        input.focus();
                    }
                }
            });
            root.addEventListener('submit', (event) => {
                event.preventDefault();
                if (event.target.id === 'composer-form') sendMessage();
                if (event.target.id === 'message-search-form') {
                    state.messageQuery = document.getElementById('message-search-input').value.trim();
                    state.tab = 'chat';
                    render();
                }
                if (event.target.id === 'group-form') {
                    const name = document.getElementById('group-name').value.trim();
                    const members = [...document.querySelectorAll('input[name="member"]:checked')].map(
                        (node) => node.value
                    );
                    if (!name || members.length < 2) {
                        document.getElementById('group-error').hidden = false;
                        return;
                    }
                    const id = `group-${++state.newGroupId}`;
                    conversations.push({
                        id,
                        name,
                        type: 'group',
                        members,
                        count: members.length + 1,
                        time: '—',
                        messages: [],
                        created: true
                    });
                    state.query = '';
                    state.filter = 'all';
                    selectConversation(id);
                    document.getElementById('message-input').focus();
                }
            });
            const initialVariant = Number(new URLSearchParams(location.search).get('variant'));
            if ([1, 2, 3, 4, 5].includes(initialVariant)) state.variant = initialVariant;
            if (new URLSearchParams(location.search).get('theme') === 'dark')
                document.documentElement.dataset.theme = 'dark';
            render();
        </script>
    </body>
</html>
