# OpenDesk Web UI 的 kro ResourceGraphDefinition（kro v0.9.4+，需开启 CELOmitFunction 特性开关）
#
#   kubectl apply -f opendesk-rgd.yaml
#   kubectl get rgd opendesk            # STATE 为 Active 后即可创建 OpenDesk 实例（示例见 opendesk-instance.example.yaml）
#
# 每个 OpenDesk 实例 = 一个用户：Deployment（单副本，Recreate）+ Service + 存放 /home/opendesk 的 PVC。
# - storage.existingClaim 为空时创建 <实例名>-home；填写时直接挂载已有 PVC，不创建也不删除它。
#   为了不在修改 spec 时误删数据，existingClaim / storageClassName / accessMode 创建后不可修改。
# - 访问令牌来自 Secret（auth.tokenSecret，默认 <实例名>-web-token，键 OPENDESK_WEB_TOKEN）；
#   Secret 不存在时服务不做认证，只适合前面已有一层认证的部署。
# - 不包含 HTTPRoute / NetworkPolicy，入口与访问控制由集群自行配置。
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
    name: opendesk
spec:
    schema:
        apiVersion: v1alpha1
        kind: OpenDesk
        spec:
            image: string | default="ghcr.io/chaowubest/opendesk-web:genui" description="OpenDesk web 模式镜像"
            imagePullPolicy: string | default="IfNotPresent" enum="Always,IfNotPresent,Never"
            imagePullSecrets: '[]string | default=[] description="拉取镜像用的 Secret 名称（镜像私有时填写）"'
            auth:
                tokenSecret: string | default="" description="存放访问令牌的 Secret；留空时使用 <实例名>-web-token，Secret 不存在则不启用认证"
                tokenKey: string | default="OPENDESK_WEB_TOKEN" description="Secret 中令牌对应的键"
            storage:
                existingClaim: string | default="" immutable=true description="已有 PVC 名称；留空时创建 <实例名>-home"
                size: string | default="10Gi" description="新建 PVC 的容量（existingClaim 为空时生效）"
                storageClassName: string | default="" immutable=true description="新建 PVC 的 StorageClass；留空使用集群默认"
                accessMode: string | default="ReadWriteOnce" immutable=true enum="ReadWriteOnce,ReadWriteOncePod,ReadWriteMany"
            resources:
                requests:
                    cpu: string | default="250m"
                    memory: string | default="1Gi"
                limits:
                    cpu: string | default="2"
                    memory: string | default="4Gi"
            service:
                type: string | default="ClusterIP" enum="ClusterIP,NodePort,LoadBalancer"
                port: integer | default=80 minimum=1 maximum=65535
            nodeSelector: 'map[string]string | default={}'
            excludedNodes: '[]string | default=["k8s-single"] minItems=1 description="不调度到这些节点（kubernetes.io/hostname）"'
        status:
            availableReplicas: ${deployment.status.?availableReplicas.orValue(0)}
            claimName: ${deployment.spec.template.spec.volumes[0].persistentVolumeClaim.claimName}
            serviceHost: '${service.metadata.name}.${service.metadata.namespace}.svc'

    resources:
        # 未指定 existingClaim 时创建 PVC；Deployment 只按名称引用它，使用已有 PVC 时不受影响。
        # storageClassName 留空时用 omit() 省略字段（写成 "" 表示“不使用任何 StorageClass”）。
        - id: pvc
          includeWhen:
              - ${schema.spec.storage.existingClaim == ""}
          template:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                  name: ${schema.metadata.name}-home
                  namespace: ${schema.metadata.namespace}
                  labels:
                      app.kubernetes.io/name: opendesk
                      app.kubernetes.io/instance: ${schema.metadata.name}
              spec:
                  storageClassName: '${schema.spec.storage.storageClassName != "" ? schema.spec.storage.storageClassName : omit()}'
                  accessModes:
                      - ${schema.spec.storage.accessMode}
                  resources:
                      requests:
                          storage: ${schema.spec.storage.size}

        - id: deployment
          readyWhen:
              - ${deployment.status.?availableReplicas.orValue(0) >= 1}
          template:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                  name: ${schema.metadata.name}
                  namespace: ${schema.metadata.namespace}
                  labels:
                      app.kubernetes.io/name: opendesk
                      app.kubernetes.io/instance: ${schema.metadata.name}
              spec:
                  # OpenDesk 有单实例锁，同一份数据只能跑一个副本
                  replicas: 1
                  strategy:
                      type: Recreate
                  selector:
                      matchLabels:
                          app.kubernetes.io/name: opendesk
                          app.kubernetes.io/instance: ${schema.metadata.name}
                  template:
                      metadata:
                          labels:
                              app.kubernetes.io/name: opendesk
                              app.kubernetes.io/instance: ${schema.metadata.name}
                      spec:
                          imagePullSecrets: '${size(schema.spec.imagePullSecrets) > 0 ? schema.spec.imagePullSecrets.map(secret, {"name": secret}) : omit()}'
                          nodeSelector: '${size(schema.spec.nodeSelector) > 0 ? schema.spec.nodeSelector : omit()}'
                          affinity:
                              nodeAffinity:
                                  requiredDuringSchedulingIgnoredDuringExecution:
                                      nodeSelectorTerms:
                                          - matchExpressions:
                                                - key: node-role.kubernetes.io/control-plane
                                                  operator: DoesNotExist
                                                - key: kubernetes.io/hostname
                                                  operator: NotIn
                                                  values: ${schema.spec.excludedNodes}
                          securityContext:
                              runAsUser: 1000
                              runAsGroup: 1000
                              runAsNonRoot: true
                              fsGroup: 1000
                              fsGroupChangePolicy: OnRootMismatch
                              seccompProfile:
                                  type: RuntimeDefault
                          terminationGracePeriodSeconds: 30
                          containers:
                              - name: opendesk
                                image: ${schema.spec.image}
                                imagePullPolicy: ${schema.spec.imagePullPolicy}
                                ports:
                                    - name: http
                                      containerPort: 8080
                                env:
                                    - name: OPENDESK_WEB_PORT
                                      value: '8080'
                                    - name: OPENDESK_WEB_HOST
                                      value: 0.0.0.0
                                    - name: OPENDESK_WEB_TOKEN
                                      valueFrom:
                                          secretKeyRef:
                                              name: '${schema.spec.auth.tokenSecret != "" ? schema.spec.auth.tokenSecret : schema.metadata.name + "-web-token"}'
                                              key: ${schema.spec.auth.tokenKey}
                                              # Secret 不存在时不设置该变量，服务不做认证
                                              optional: true
                                securityContext:
                                    allowPrivilegeEscalation: false
                                    capabilities:
                                        drop: [ALL]
                                resources:
                                    requests:
                                        cpu: ${schema.spec.resources.requests.cpu}
                                        memory: ${schema.spec.resources.requests.memory}
                                    limits:
                                        cpu: ${schema.spec.resources.limits.cpu}
                                        memory: ${schema.spec.resources.limits.memory}
                                startupProbe:
                                    httpGet:
                                        path: /__opendesk/health
                                        port: http
                                    periodSeconds: 5
                                    failureThreshold: 36
                                readinessProbe:
                                    httpGet:
                                        path: /__opendesk/health
                                        port: http
                                    periodSeconds: 10
                                livenessProbe:
                                    httpGet:
                                        path: /__opendesk/health
                                        port: http
                                    periodSeconds: 30
                                    timeoutSeconds: 5
                                    failureThreshold: 3
                                volumeMounts:
                                    - name: home
                                      mountPath: /home/opendesk
                          volumes:
                              - name: home
                                persistentVolumeClaim:
                                    claimName: '${schema.spec.storage.existingClaim != "" ? schema.spec.storage.existingClaim : schema.metadata.name + "-home"}'

        - id: service
          template:
              apiVersion: v1
              kind: Service
              metadata:
                  name: ${schema.metadata.name}
                  namespace: ${schema.metadata.namespace}
                  labels:
                      app.kubernetes.io/name: opendesk
                      app.kubernetes.io/instance: ${schema.metadata.name}
              spec:
                  type: ${schema.spec.service.type}
                  selector:
                      app.kubernetes.io/name: opendesk
                      app.kubernetes.io/instance: ${schema.metadata.name}
                  ports:
                      - name: http
                        port: ${schema.spec.service.port}
                        targetPort: http
